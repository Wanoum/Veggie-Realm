<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mes recettes</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F5F3EE" />
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F5F3EE;
    color: #2C2C2A;
    margin: 0;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 8px 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
  .count { font-size: 13px; color: #6b6b68; margin-bottom: 16px; }
  .card {
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    background: #E6F1FB;
    color: #0C447C;
    padding: 2px 8px;
    border-radius: 8px;
  }
  #backBtn {
    background: white;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .servings-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #EFEDE6;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 16px 0;
  }
  .servings-box button {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 0.5px solid #ccc;
    background: white;
    font-size: 16px;
  }
  .ing-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-top: 0.5px solid #e0dfd8;
  }
  .ing-row:first-child { border-top: none; }
  .ing-qty {
    font-family: Georgia, serif;
    color: #6b6b68;
    white-space: nowrap;
  }
  ol { padding-left: 20px; }
  ol li { margin-bottom: 8px; line-height: 1.5; }
  .notice {
    background: #FAEEDA;
    color: #633806;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  #bottomNav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: white;
    border-top: 0.5px solid #ddd;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    padding: 6px 0;
    font-size: 11px;
    color: #999;
  }
  .nav-btn.active { color: #2C2C2A; font-weight: 600; }
  .nav-icon { font-size: 20px; line-height: 1; }
  body { padding-bottom: 90px; }
  .empty { text-align: center; color: #6b6b68; padding: 40px 0; font-size: 14px; }
  .field-label { display:block; font-size:13px; color:#6b6b68; margin:14px 0 4px; }
  .field-input {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: white;
  }
  .secondary-btn {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: 1px dashed #999;
    border-radius: 8px;
    background: transparent;
    color: #555;
    font-size: 14px;
  }
  .primary-btn {
    width: 100%;
    padding: 13px;
    margin-top: 24px;
    border: none;
    border-radius: 8px;
    background: #2C2C2A;
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  .row-item {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-item input { flex: 1; }
  .row-item .qty-input { max-width: 70px; }
  .row-item .unit-input { max-width: 70px; }
  .remove-row {
    background: none;
    border: none;
    color: #B3261E;
    font-size: 18px;
    padding: 4px 8px;
  }
  .step-item textarea {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    resize: vertical;
    min-height: 44px;
  }
</style>
</head>
<body>

<div id="listView">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h1>Mes recettes</h1>
    <button id="refreshBtn" style="background:white;border:0.5px solid #ccc;border-radius:8px;padding:6px 12px;font-size:13px;">↻ Rafraîchir</button>
  </div>
  <p class="count" id="count">Chargement...</p>
  <div id="cards"></div>
</div>

<div id="detailView" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <button id="backBtn">&larr; Retour</button>
    <div style="display:flex;gap:8px;">
      <button id="editBtn" style="background:white;border:0.5px solid #ccc;border-radius:8px;padding:8px 14px;font-size:14px;">Modifier</button>
      <button id="deleteBtn" style="background:white;border:0.5px solid #B3261E;color:#B3261E;border-radius:8px;padding:8px 14px;font-size:14px;">Supprimer</button>
    </div>
  </div>
  <div id="detailContent"></div>
</div>

<div id="formView" style="display:none;">
  <button id="formBackBtn">&larr; Annuler</button>
  <h1 id="formTitle">Nouvelle recette</h1>

  <label class="field-label">Titre</label>
  <input id="f_title" class="field-input" placeholder="Ex: Gâteau au yaourt" />

  <label class="field-label">Tags (séparés par une virgule)</label>
  <input id="f_tags" class="field-input" placeholder="Ex: dessert, goûter" />

  <label class="field-label">Portions de référence</label>
  <input id="f_servings" class="field-input" type="number" value="4" />

  <div style="display:flex; gap:10px;">
    <div style="flex:1;">
      <label class="field-label">Temps de cuisson (min)</label>
      <input id="f_cook" class="field-input" type="number" />
    </div>
    <div style="flex:1;">
      <label class="field-label">Température four (°C)</label>
      <input id="f_oven" class="field-input" type="number" />
    </div>
  </div>

  <label class="field-label">Note (optionnel)</label>
  <input id="f_notes" class="field-input" placeholder="Ex: Attention aux oeufs avec le chocolat chaud !" />

  <h2>Ingrédients</h2>
  <div id="f_ingredients"></div>
  <button type="button" id="addIngBtn" class="secondary-btn">+ Ajouter un ingrédient</button>

  <h2>Étapes</h2>
  <div id="f_steps"></div>
  <button type="button" id="addStepBtn" class="secondary-btn">+ Ajouter une étape</button>

  <button type="button" id="saveBtn" class="primary-btn">Enregistrer la recette</button>
  <p id="formError" style="color:#B3261E;font-size:13px;"></p>
</div>

<nav id="bottomNav">
  <button id="navHome" class="nav-btn active">
    <span class="nav-icon">⌂</span>
    <span>Accueil</span>
  </button>
  <button id="navAdd" class="nav-btn">
    <span class="nav-icon">+</span>
    <span>Ajouter</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bhsftmcluaqztkfnwobx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoc2Z0bWNsdWFxenRrZm53b2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTE1ODgsImV4cCI6MjEwNDc4NzU4OH0.ovrCW7IRhkH8tfMYyExNp6zKt60EJMpJLcehlastIAI";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let recipes = [];
  let currentServings = {};

  async function loadRecipes() {
    const { data, error } = await sb.from('recipes').select('*').order('created_at', { ascending: false });
    if (error) {
      document.getElementById('count').textContent = "Erreur de chargement";
      console.error(error);
      return;
    }
    recipes = data;
    renderList();
  }

  function renderList() {
    document.getElementById('count').textContent = recipes.length + " recette" + (recipes.length > 1 ? "s" : "");
    const cardsEl = document.getElementById('cards');
    if (recipes.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucune recette pour l\'instant.</div>';
      return;
    }
    cardsEl.innerHTML = recipes.map((r, i) => `
      <div class="card" onclick="showDetail(${i})">
        <h3>${r.title}</h3>
        <div class="tags">${(r.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
      </div>
    `).join('');
  }

  let currentDetailIndex = null;

  function showDetail(i) {
    currentDetailIndex = i;
    const r = recipes[i];
    currentServings[i] = r.servings || 4;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'none';
    renderDetail(i);
  }

  function renderDetail(i) {
    const r = recipes[i];
    const base = r.servings || 4;
    const s = currentServings[i];
    const meta = [];
    if (r.cook_time_minutes) meta.push(r.cook_time_minutes + " min");
    if (r.oven_temp_celsius) meta.push(r.oven_temp_celsius + "°");

    const ingredientsHtml = (r.ingredients || []).map(ing => {
      const q = ing.quantity != null ? (ing.quantity * s / base) : null;
      const qDisplay = q != null ? (Number.isInteger(q) ? q : q.toFixed(1).replace(/[.]0$/, '')) : '';
      return `<div class="ing-row">
        <span>${ing.name}${ing.note ? ' <span style="color:#999;font-size:12px;">(' + ing.note + ')</span>' : ''}</span>
        <span class="ing-qty">${qDisplay} ${ing.unit || ''}</span>
      </div>`;
    }).join('');

    const stepsHtml = (r.steps && r.steps.length > 0)
      ? '<h2>Étapes</h2><ol>' + r.steps.map(st => `<li>${st}</li>`).join('') + '</ol>'
      : '';

    document.getElementById('detailContent').innerHTML = `
      <h1>${r.title}</h1>
      <div class="tags">${(r.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
      ${meta.length ? `<p style="font-size:13px;color:#6b6b68;">${meta.join(' · ')}</p>` : ''}
      ${r.notes ? `<div class="notice">${r.notes}</div>` : ''}
      <div class="servings-box">
        <span style="font-size:14px;color:#6b6b68;">Portions</span>
        <div style="display:flex;align-items:center;gap:14px;">
          <button onclick="changeServings(${i}, -1)">−</button>
          <span style="font-weight:600;min-width:16px;text-align:center;">${s}</span>
          <button onclick="changeServings(${i}, 1)">+</button>
        </div>
      </div>
      <h2>Ingrédients</h2>
      ${ingredientsHtml}
      ${stepsHtml}
    `;
  }

  function changeServings(i, delta) {
    const newVal = currentServings[i] + delta;
    if (newVal < 1) return;
    currentServings[i] = newVal;
    renderDetail(i);
  }

  document.getElementById('backBtn').onclick = () => {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
  };

  function showHome() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navHome').classList.add('active');
    document.getElementById('navAdd').classList.remove('active');
  }

  function showForm() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
    document.getElementById('navHome').classList.remove('active');
    document.getElementById('navAdd').classList.add('active');
    resetForm();
  }

  document.getElementById('navHome').onclick = showHome;
  document.getElementById('navAdd').onclick = showForm;
  document.getElementById('formBackBtn').onclick = showHome;

  document.getElementById('refreshBtn').onclick = () => {
    document.getElementById('count').textContent = "Chargement...";
    loadRecipes();
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.getElementById('listView').style.display !== 'none') {
      loadRecipes();
    }
  });

  // ---- Gestion du formulaire d'ajout / édition ----
  let ingRows = [];
  let stepRows = [];
  let editingId = null;

  document.getElementById('editBtn').onclick = () => {
    const r = recipes[currentDetailIndex];
    editingId = r.id;
    document.getElementById('formTitle').textContent = "Modifier la recette";
    document.getElementById('f_title').value = r.title || '';
    document.getElementById('f_tags').value = (r.tags || []).join(', ');
    document.getElementById('f_servings').value = r.servings || 4;
    document.getElementById('f_cook').value = r.cook_time_minutes || '';
    document.getElementById('f_oven').value = r.oven_temp_celsius || '';
    document.getElementById('f_notes').value = r.notes || '';
    ingRows = (r.ingredients || []).map(ing => ({
      quantity: ing.quantity ?? '', unit: ing.unit ?? '', name: ing.name ?? ''
    }));
    if (ingRows.length === 0) ingRows = [{ quantity: '', unit: '', name: '' }];
    stepRows = (r.steps && r.steps.length > 0) ? [...r.steps] : [''];
    renderIngRows();
    renderStepRows();
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
  };

  document.getElementById('deleteBtn').onclick = async () => {
    const r = recipes[currentDetailIndex];
    if (!confirm(`Supprimer "${r.title}" ? Cette action est irréversible.`)) return;
    const { error } = await sb.from('recipes').delete().eq('id', r.id);
    if (error) {
      alert("Erreur lors de la suppression : " + error.message);
      return;
    }
    await loadRecipes();
    showHome();
  };

  function renderIngRows() {
    document.getElementById('f_ingredients').innerHTML = ingRows.map((_, idx) => `
      <div class="row-item">
        <input class="qty-input" type="number" step="any" placeholder="Qté" data-idx="${idx}" data-field="quantity" value="${ingRows[idx].quantity ?? ''}" />
        <input class="unit-input" placeholder="Unité" data-idx="${idx}" data-field="unit" value="${ingRows[idx].unit ?? ''}" />
        <input placeholder="Nom de l'ingrédient" data-idx="${idx}" data-field="name" value="${ingRows[idx].name ?? ''}" />
        <button type="button" class="remove-row" data-remove-ing="${idx}">✕</button>
      </div>
    `).join('');
    document.querySelectorAll('#f_ingredients input').forEach(inp => {
      inp.oninput = (e) => {
        const idx = e.target.dataset.idx, field = e.target.dataset.field;
        ingRows[idx][field] = e.target.value;
      };
    });
    document.querySelectorAll('[data-remove-ing]').forEach(btn => {
      btn.onclick = (e) => {
        ingRows.splice(Number(e.target.dataset.removeIng), 1);
        renderIngRows();
      };
    });
  }

  function renderStepRows() {
    document.getElementById('f_steps').innerHTML = stepRows.map((_, idx) => `
      <div class="row-item step-item">
        <textarea placeholder="Étape ${idx + 1}" data-idx="${idx}">${stepRows[idx] ?? ''}</textarea>
        <button type="button" class="remove-row" data-remove-step="${idx}">✕</button>
      </div>
    `).join('');
    document.querySelectorAll('#f_steps textarea').forEach(ta => {
      ta.oninput = (e) => { stepRows[e.target.dataset.idx] = e.target.value; };
    });
    document.querySelectorAll('[data-remove-step]').forEach(btn => {
      btn.onclick = (e) => {
        stepRows.splice(Number(e.target.dataset.removeStep), 1);
        renderStepRows();
      };
    });
  }

  document.getElementById('addIngBtn').onclick = () => {
    ingRows.push({ quantity: '', unit: '', name: '' });
    renderIngRows();
  };

  document.getElementById('addStepBtn').onclick = () => {
    stepRows.push('');
    renderStepRows();
  };

  function resetForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = "Nouvelle recette";
    document.getElementById('f_title').value = '';
    document.getElementById('f_tags').value = '';
    document.getElementById('f_servings').value = 4;
    document.getElementById('f_cook').value = '';
    document.getElementById('f_oven').value = '';
    document.getElementById('f_notes').value = '';
    document.getElementById('formError').textContent = '';
    ingRows = [{ quantity: '', unit: '', name: '' }];
    stepRows = [''];
    renderIngRows();
    renderStepRows();
  }

  document.getElementById('saveBtn').onclick = async () => {
    const title = document.getElementById('f_title').value.trim();
    const errEl = document.getElementById('formError');
    errEl.textContent = '';

    if (!title) {
      errEl.textContent = "Le titre est obligatoire.";
      return;
    }

    const tags = document.getElementById('f_tags').value
      .split(',').map(t => t.trim()).filter(Boolean);

    const ingredients = ingRows
      .filter(ing => ing.name && ing.name.trim())
      .map(ing => ({
        name: ing.name.trim(),
        quantity: ing.quantity !== '' && ing.quantity != null ? Number(ing.quantity) : null,
        unit: ing.unit ? ing.unit.trim() : null
      }));

    const steps = stepRows.map(s => s.trim()).filter(Boolean);

    const payload = {
      title,
      tags,
      servings: Number(document.getElementById('f_servings').value) || 4,
      cook_time_minutes: document.getElementById('f_cook').value ? Number(document.getElementById('f_cook').value) : null,
      oven_temp_celsius: document.getElementById('f_oven').value ? Number(document.getElementById('f_oven').value) : null,
      notes: document.getElementById('f_notes').value.trim() || null,
      ingredients,
      steps
    };

    document.getElementById('saveBtn').textContent = "Enregistrement...";
    document.getElementById('saveBtn').disabled = true;

    const { error } = editingId
      ? await sb.from('recipes').update(payload).eq('id', editingId)
      : await sb.from('recipes').insert(payload);

    document.getElementById('saveBtn').textContent = "Enregistrer la recette";
    document.getElementById('saveBtn').disabled = false;

    if (error) {
      errEl.textContent = "Erreur lors de l'enregistrement : " + error.message;
      console.error(error);
      return;
    }

    resetForm();
    await loadRecipes();
    showHome();
  };

  resetForm();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  loadRecipes();
</script>
</body>
</html>
