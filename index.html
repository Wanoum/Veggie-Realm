<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Mes recettes</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F5F3EE" />
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F5F3EE;
    color: #2C2C2A;
    margin: 0;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 8px 0 4px; }
  h2 { font-size: 16px; font-weight: 600; margin: 20px 0 8px; }
  .count { font-size: 13px; color: #6b6b68; margin-bottom: 16px; }
  .card {
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .card-inner { display: flex; align-items: center; gap: 12px; }
  .card-thumb {
    width: 56px;
    height: 56px;
    border-radius: 10px;
    background: #EFEDE6;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    overflow: hidden;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px;
    background: #E6F1FB;
    color: #0C447C;
    padding: 2px 8px;
    border-radius: 8px;
  }
  #backBtn {
    background: white;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  .servings-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #EFEDE6;
    border-radius: 8px;
    padding: 10px 14px;
    margin: 16px 0;
  }
  .servings-box button {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 0.5px solid #ccc;
    background: white;
    font-size: 16px;
  }
  .ing-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-top: 0.5px solid #e0dfd8;
  }
  .ing-row:first-child { border-top: none; }
  .ing-qty {
    font-family: Georgia, serif;
    color: #6b6b68;
    white-space: nowrap;
  }
  ol { padding-left: 20px; }
  ol li { margin-bottom: 8px; line-height: 1.5; }
  .notice {
    background: #FAEEDA;
    color: #633806;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  #bottomNav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: white;
    border-top: 0.5px solid #ddd;
    padding: 6px 0 max(6px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    padding: 6px 0;
    font-size: 11px;
    color: #999;
  }
  .nav-btn.active { color: #2C2C2A; font-weight: 600; }
  .nav-icon { font-size: 20px; line-height: 1; }
  body { padding-bottom: 90px; }
  .empty { text-align: center; color: #6b6b68; padding: 40px 0; font-size: 14px; }
  .field-label { display:block; font-size:13px; color:#6b6b68; margin:14px 0 4px; }
  .field-input {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: white;
  }
  .secondary-btn {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: 1px dashed #999;
    border-radius: 8px;
    background: transparent;
    color: #555;
    font-size: 14px;
  }
  .primary-btn {
    width: 100%;
    padding: 13px;
    margin-top: 24px;
    border: none;
    border-radius: 8px;
    background: #2C2C2A;
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  .row-item {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-item input, .row-item select {
    padding: 10px 12px;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    background: white;
  }
  .row-item input { flex: 2; min-width: 0; }
  .row-item .qty-input { flex: 1; }
  .row-item .unit-input { flex: 1.3; }
  .remove-row {
    background: none;
    border: none;
    color: #B3261E;
    font-size: 18px;
    padding: 4px 8px;
  }
  .step-item textarea {
    width: 100%;
    padding: 10px 12px;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    resize: vertical;
    min-height: 44px;
  }
  .day-row {
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .day-row .day-name { font-size: 13px; color: #6b6b68; margin-bottom: 6px; text-transform: capitalize; }
  .day-row select { width: 100%; padding: 9px 10px; border: 0.5px solid #ccc; border-radius: 8px; font-size: 14px; background: white; margin-bottom: 6px; }
  .day-row .servings-mini { display: flex; align-items: center; gap: 10px; }
  .day-row .servings-mini button { width: 26px; height: 26px; border-radius: 50%; border: 0.5px solid #ccc; background: white; font-size: 14px; }
  .course-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-top: 0.5px solid #e0dfd8;
    font-size: 14px;
  }
  .course-item:first-child { border-top: none; }
  .course-item input[type="checkbox"] { width: 18px; height: 18px; }
  .course-item.checked { color: #999; text-decoration: line-through; }
  .course-qty { margin-left: auto; font-family: Georgia, serif; color: #6b6b68; white-space: nowrap; }
  .subtabs {
    display: flex;
    background: #EFEDE6;
    border-radius: 10px;
    padding: 3px;
    margin: 12px 0 18px;
  }
  .subtab-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    color: #6b6b68;
  }
  .subtab-btn.active { background: white; color: #2C2C2A; font-weight: 600; }
  .plan-summary {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .plan-summary .summary-chip {
    font-size: 12px;
    background: var(--bg-accent, #E6F1FB);
    color: #0C447C;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .plan-recipe-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border: 0.5px solid #ddd;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .plan-recipe-row .plan-recipe-name { font-size: 14px; font-weight: 500; }
  .plan-recipe-row .plan-recipe-tags { font-size: 11px; color: #999; margin-top: 2px; }
  .plan-stepper { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .plan-stepper button { width: 28px; height: 28px; border-radius: 50%; border: 0.5px solid #ccc; background: white; font-size: 15px; }
  .plan-stepper span { min-width: 14px; text-align: center; font-weight: 600; }
  .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-chip {
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid #ccc;
    background: white;
    color: #555;
  }
  .filter-chip.active { background: #2C2C2A; color: white; border-color: #2C2C2A; }
  .autocomplete-box {
    position: absolute;
    background: white;
    border: 0.5px solid #ccc;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    z-index: 200;
    max-height: 160px;
    overflow-y: auto;
  }
  .autocomplete-item {
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .autocomplete-item:hover, .autocomplete-item.highlighted { background: #F5F3EE; }
</style>
</head>
<body>

<div id="listView">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h1>Mes recettes</h1>
    <button id="refreshBtn" style="background:white;border:0.5px solid #ccc;border-radius:8px;padding:6px 12px;font-size:13px;">↻ Rafraîchir</button>
  </div>
  <input id="searchInput" class="field-input" placeholder="Rechercher une recette..." style="margin:10px 0;" />
  <div id="tagFilters" class="tag-filters"></div>
  <p class="count" id="count">Chargement...</p>
  <div id="cards"></div>
</div>

<div id="detailView" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <button id="backBtn">&larr; Retour</button>
    <div style="display:flex;gap:8px;">
      <button id="editBtn" style="background:white;border:0.5px solid #ccc;border-radius:8px;padding:8px 14px;font-size:14px;">Modifier</button>
      <button id="deleteBtn" style="background:white;border:0.5px solid #B3261E;color:#B3261E;border-radius:8px;padding:8px 14px;font-size:14px;">Supprimer</button>
    </div>
  </div>
  <div id="detailContent"></div>
</div>

<div id="formView" style="display:none;">
  <button id="formBackBtn">&larr; Annuler</button>
  <h1 id="formTitle">Nouvelle recette</h1>

  <label class="field-label">Titre</label>
  <input id="f_title" class="field-input" placeholder="Ex: Gâteau au yaourt" />

  <label class="field-label">Photo (lien URL, optionnel)</label>
  <input id="f_photo" class="field-input" placeholder="https://..." />

  <label class="field-label">Tags (séparés par une virgule)</label>
  <input id="f_tags" class="field-input" placeholder="Ex: dessert, goûter" />

  <label class="field-label">Portions de référence</label>
  <input id="f_servings" class="field-input" type="number" value="4" />

  <div style="display:flex; gap:10px;">
    <div style="flex:1;">
      <label class="field-label">Temps de cuisson (min)</label>
      <input id="f_cook" class="field-input" type="number" />
    </div>
    <div style="flex:1;">
      <label class="field-label">Température four (°C)</label>
      <input id="f_oven" class="field-input" type="number" />
    </div>
  </div>

  <label class="field-label">Note (optionnel)</label>
  <input id="f_notes" class="field-input" placeholder="Ex: Attention aux oeufs avec le chocolat chaud !" />

  <h2>Ingrédients</h2>
  <div id="f_ingredients" style="position:relative;"></div>
  <button type="button" id="addIngBtn" class="secondary-btn">+ Ajouter un ingrédient</button>

  <h2>Étapes</h2>
  <label class="field-label">Étapes (une par ligne)</label>
  <textarea id="f_steps" class="field-input" style="min-height:140px;resize:vertical;" placeholder="Préchauffer le four à 180°.&#10;Mélanger le beurre et le sucre.&#10;Ajouter la farine..."></textarea>

  <button type="button" id="saveBtn" class="primary-btn">Enregistrer la recette</button>
  <p id="formError" style="color:#B3261E;font-size:13px;"></p>
</div>

<nav id="bottomNav">
  <button id="navHome" class="nav-btn active">
    <span class="nav-icon">⌂</span>
    <span>Accueil</span>
  </button>
  <button id="navPlanning" class="nav-btn">
    <span class="nav-icon">📅</span>
    <span>Planning</span>
  </button>
  <button id="navAdd" class="nav-btn">
    <span class="nav-icon">+</span>
    <span>Ajouter</span>
  </button>
</nav>

<div id="planningView" style="display:none;">
  <h1>Planning</h1>
  <div class="subtabs">
    <button id="subtabRecipes" class="subtab-btn active">Recettes</button>
    <button id="subtabCourses" class="subtab-btn">Liste de courses</button>
  </div>

  <div id="planningRecipesPanel">
    <div id="planSummary" class="plan-summary"></div>
    <div id="planningRecipeList"></div>
  </div>

  <div id="planningCoursesPanel" style="display:none;">
    <div id="coursesList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bhsftmcluaqztkfnwobx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoc2Z0bWNsdWFxenRrZm53b2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTE1ODgsImV4cCI6MjEwNDc4NzU4OH0.ovrCW7IRhkH8tfMYyExNp6zKt60EJMpJLcehlastIAI";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let recipes = [];
  let currentServings = {};

  async function loadRecipes() {
    const { data, error } = await sb.from('recipes').select('*').order('created_at', { ascending: false });
    if (error) {
      document.getElementById('count').textContent = "Erreur de chargement";
      console.error(error);
      return;
    }
    recipes = data;
    renderList();
  }

  let activeTagFilter = null;
  let searchQuery = '';

  function renderTagFilters() {
    const allTags = [...new Set(recipes.flatMap(r => r.tags || []))].sort();
    const container = document.getElementById('tagFilters');
    if (allTags.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = allTags.map(t => `
      <button type="button" class="filter-chip ${activeTagFilter === t ? 'active' : ''}" data-tag="${t}">#${t}</button>
    `).join('');
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.onclick = () => {
        const tag = chip.dataset.tag;
        activeTagFilter = (activeTagFilter === tag) ? null : tag;
        renderList();
      };
    });
  }

  function getFilteredIndices() {
    return recipes
      .map((r, i) => i)
      .filter(i => {
        const r = recipes[i];
        const matchesSearch = !searchQuery || r.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = !activeTagFilter || (r.tags || []).includes(activeTagFilter);
        return matchesSearch && matchesTag;
      });
  }

  function renderList() {
    renderTagFilters();
    const filteredIndices = getFilteredIndices();
    document.getElementById('count').textContent = filteredIndices.length + " recette" + (filteredIndices.length > 1 ? "s" : "");
    const cardsEl = document.getElementById('cards');
    if (recipes.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucune recette pour l\'instant.</div>';
      return;
    }
    if (filteredIndices.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucun résultat pour ces critères.</div>';
      return;
    }
    cardsEl.innerHTML = filteredIndices.map(i => {
      const r = recipes[i];
      return `
      <div class="card" onclick="showDetail(${i})">
        <div class="card-inner">
          <div class="card-thumb">
            ${r.photo_url
              ? `<img src="${r.photo_url}" alt="" onerror="this.parentElement.innerHTML='🍽️'" />`
              : '🍽️'}
          </div>
          <div style="flex:1;min-width:0;">
            <h3>${r.title}</h3>
            <div class="tags">${(r.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
          </div>
        </div>
      </div>
    `;
    }).join('');
  }

  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    renderList();
  };

  let currentDetailIndex = null;

  function showDetail(i) {
    currentDetailIndex = i;
    const r = recipes[i];
    currentServings[i] = r.servings || 4;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'none';
    renderDetail(i);
  }

  function renderDetail(i) {
    const r = recipes[i];
    const base = r.servings || 4;
    const s = currentServings[i];
    const meta = [];
    if (r.cook_time_minutes) meta.push(r.cook_time_minutes + " min");
    if (r.oven_temp_celsius) meta.push(r.oven_temp_celsius + "°");

    const ingredientsHtml = (r.ingredients || []).map(ing => {
      const q = ing.quantity != null ? (ing.quantity * s / base) : null;
      const qDisplay = q != null ? (Number.isInteger(q) ? q : q.toFixed(1).replace(/[.]0$/, '')) : '';
      return `<div class="ing-row">
        <span>${ing.name}${ing.note ? ' <span style="color:#999;font-size:12px;">(' + ing.note + ')</span>' : ''}</span>
        <span class="ing-qty">${qDisplay} ${ing.unit || ''}</span>
      </div>`;
    }).join('');

    const stepsHtml = (r.steps && r.steps.length > 0)
      ? '<h2>Étapes</h2><ol>' + r.steps.map(st => `<li>${st}</li>`).join('') + '</ol>'
      : '';

    document.getElementById('detailContent').innerHTML = `
      ${r.photo_url ? `<img src="${r.photo_url}" alt="" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:14px;" onerror="this.style.display='none'" />` : ''}
      <h1>${r.title}</h1>
      <div class="tags">${(r.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
      ${meta.length ? `<p style="font-size:13px;color:#6b6b68;">${meta.join(' · ')}</p>` : ''}
      ${r.notes ? `<div class="notice">${r.notes}</div>` : ''}
      <div class="servings-box">
        <span style="font-size:14px;color:#6b6b68;">Portions</span>
        <div style="display:flex;align-items:center;gap:14px;">
          <button onclick="changeServings(${i}, -1)">−</button>
          <span style="font-weight:600;min-width:16px;text-align:center;">${s}</span>
          <button onclick="changeServings(${i}, 1)">+</button>
        </div>
      </div>
      <h2>Ingrédients</h2>
      ${ingredientsHtml}
      ${stepsHtml}
    `;
  }

  function changeServings(i, delta) {
    const newVal = currentServings[i] + delta;
    if (newVal < 1) return;
    currentServings[i] = newVal;
    renderDetail(i);
  }

  document.getElementById('backBtn').onclick = () => {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
  };

  function hideAllViews() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('planningView').style.display = 'none';
    document.getElementById('navHome').classList.remove('active');
    document.getElementById('navAdd').classList.remove('active');
    document.getElementById('navPlanning').classList.remove('active');
  }

  function showHome() {
    hideAllViews();
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navHome').classList.add('active');
  }

  function showForm() {
    hideAllViews();
    document.getElementById('formView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navAdd').classList.add('active');
    resetForm();
  }

  function showPlanning() {
    hideAllViews();
    document.getElementById('planningView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navPlanning').classList.add('active');
    renderPlanningRecipes();
  }

  document.getElementById('navHome').onclick = showHome;
  document.getElementById('navAdd').onclick = showForm;
  document.getElementById('navPlanning').onclick = showPlanning;
  document.getElementById('formBackBtn').onclick = showHome;

  document.getElementById('refreshBtn').onclick = () => {
    location.href = location.pathname + '?t=' + Date.now();
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.getElementById('listView').style.display !== 'none') {
      loadRecipes();
    }
  });

  // ---- Gestion du formulaire d'ajout / édition ----
  let ingRows = [];
  let editingId = null;

  document.getElementById('editBtn').onclick = () => {
    const r = recipes[currentDetailIndex];
    editingId = r.id;
    document.getElementById('formTitle').textContent = "Modifier la recette";
    document.getElementById('f_title').value = r.title || '';
    document.getElementById('f_photo').value = r.photo_url || '';
    document.getElementById('f_tags').value = (r.tags || []).join(', ');
    document.getElementById('f_servings').value = r.servings || 4;
    document.getElementById('f_cook').value = r.cook_time_minutes || '';
    document.getElementById('f_oven').value = r.oven_temp_celsius || '';
    document.getElementById('f_notes').value = r.notes || '';
    ingRows = (r.ingredients || []).map(ing => ({
      qtyUnitText: [ing.quantity, ing.unit].filter(v => v != null && v !== '').join(' '),
      name: ing.name ?? ''
    }));
    if (ingRows.length === 0) ingRows = [{ qtyUnitText: '', name: '' }];
    document.getElementById('f_steps').value = (r.steps || []).join('\n');
    renderIngRows();
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
  };

  document.getElementById('deleteBtn').onclick = async () => {
    const r = recipes[currentDetailIndex];
    if (!confirm(`Supprimer "${r.title}" ? Cette action est irréversible.`)) return;
    const { error } = await sb.from('recipes').delete().eq('id', r.id);
    if (error) {
      alert("Erreur lors de la suppression : " + error.message);
      return;
    }
    await loadRecipes();
    showHome();
  };

  // ---- Normalisation ingrédients / unités ----
  const UNIT_CANON = {
    'paquet': 'sachet', 'paquets': 'sachet', 'sachets': 'sachet',
    'grammes': 'g', 'gramme': 'g',
    'kilo': 'kg', 'kilos': 'kg', 'kilogramme': 'kg', 'kilogrammes': 'kg',
    'litres': 'l', 'litre': 'l',
    'millilitres': 'ml', 'millilitre': 'ml',
    'cas': 'c.à.s', 'cuillere a soupe': 'c.à.s', 'cuillères à soupe': 'c.à.s', 'cuillere a soupes': 'c.à.s',
    'cac': 'c.à.c', 'cuillere a cafe': 'c.à.c', 'cuillères à café': 'c.à.c',
    'pieces': 'pièce', 'piece': 'pièce', 'pièces': 'pièce',
    'tasses': 'tasse',
    'pincees': 'pincée', 'pincee': 'pincée', 'pincées': 'pincée'
  };

  function canonicalizeUnit(raw) {
    if (!raw) return null;
    let u = normalize(raw); // lowercase, trim, sans accents
    if (UNIT_CANON[u]) return UNIT_CANON[u];
    // essaie sans le "s" final (pluriel simple) si pas déjà reconnu
    if (u.endsWith('s') && UNIT_CANON[u.slice(0, -1)]) return UNIT_CANON[u.slice(0, -1)];
    return raw.trim();
  }

  function canonicalizeIngredientName(raw) {
    const trimmed = raw.trim();
    const key = normalize(trimmed).replace(/s$/, ''); // ignore pluriel simple
    const known = getKnownIngredientNames();
    const match = known.find(n => normalize(n).replace(/s$/, '') === key);
    return match || trimmed;
  }

  function getKnownIngredientNames() {
    const set = new Set();
    recipes.forEach(r => (r.ingredients || []).forEach(ing => { if (ing.name) set.add(ing.name); }));
    return [...set];
  }

  function parseQtyUnit(text) {
    const t = (text || '').trim();
    if (!t) return { quantity: null, unit: null };
    const match = t.match(/^([\d]+[.,]?[\d]*)\s*(.*)$/);
    if (match) {
      const quantity = parseFloat(match[1].replace(',', '.'));
      const unitRaw = match[2].trim();
      return { quantity: isNaN(quantity) ? null : quantity, unit: unitRaw ? canonicalizeUnit(unitRaw) : null };
    }
    // pas de nombre trouvé : tout est traité comme une unité (ex: "pincée")
    return { quantity: null, unit: canonicalizeUnit(t) };
  }

  let acBox = null;

  function closeAutocomplete() {
    if (acBox) { acBox.remove(); acBox = null; }
  }

  function openAutocomplete(inputEl, idx) {
    const query = normalize(inputEl.value);
    const matches = getKnownIngredientNames()
      .filter(n => query && normalize(n).includes(query) && normalize(n) !== query)
      .slice(0, 6);

    closeAutocomplete();
    if (matches.length === 0) return;

    acBox = document.createElement('div');
    acBox.className = 'autocomplete-box';
    acBox.style.left = inputEl.offsetLeft + 'px';
    acBox.style.top = (inputEl.offsetTop + inputEl.offsetHeight + 2) + 'px';
    acBox.style.width = inputEl.offsetWidth + 'px';
    acBox.innerHTML = matches.map(n => `<div class="autocomplete-item" data-value="${n}">${n}</div>`).join('');
    inputEl.parentElement.appendChild(acBox);

    acBox.querySelectorAll('.autocomplete-item').forEach(item => {
      item.onmousedown = (e) => {
        e.preventDefault();
        inputEl.value = item.dataset.value;
        ingRows[idx].name = item.dataset.value;
        closeAutocomplete();
      };
    });
  }

  function renderIngRows() {
    document.getElementById('f_ingredients').innerHTML = ingRows.map((_, idx) => `
      <div class="row-item" style="position:relative;">
        <input class="qty-input" placeholder="Qté (ex: 200g)" data-idx="${idx}" data-field="qtyUnitText" value="${ingRows[idx].qtyUnitText ?? ''}" />
        <input class="ing-name-input" placeholder="Nom de l'ingrédient" autocomplete="off" data-idx="${idx}" data-field="name" value="${ingRows[idx].name ?? ''}" />
        <button type="button" class="remove-row" data-remove-ing="${idx}">✕</button>
      </div>`
    ).join('');
    document.querySelectorAll('#f_ingredients input').forEach(inp => {
      const handler = (e) => {
        const idx = e.target.dataset.idx, field = e.target.dataset.field;
        ingRows[idx][field] = e.target.value;
      };
      inp.oninput = handler;
      inp.onchange = handler;
    });
    document.querySelectorAll('.ing-name-input').forEach(inp => {
      inp.addEventListener('input', () => openAutocomplete(inp, Number(inp.dataset.idx)));
      inp.addEventListener('focus', () => openAutocomplete(inp, Number(inp.dataset.idx)));
      inp.addEventListener('blur', () => setTimeout(closeAutocomplete, 150));
    });
    document.querySelectorAll('[data-remove-ing]').forEach(btn => {
      btn.onclick = (e) => {
        ingRows.splice(Number(e.target.dataset.removeIng), 1);
        renderIngRows();
      };
    });
  }

  document.getElementById('addIngBtn').onclick = () => {
    ingRows.push({ qtyUnitText: '', name: '' });
    renderIngRows();
  };

  function resetForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = "Nouvelle recette";
    document.getElementById('f_title').value = '';
    document.getElementById('f_photo').value = '';
    document.getElementById('f_tags').value = '';
    document.getElementById('f_servings').value = 4;
    document.getElementById('f_cook').value = '';
    document.getElementById('f_oven').value = '';
    document.getElementById('f_notes').value = '';
    document.getElementById('f_steps').value = '';
    document.getElementById('formError').textContent = '';
    ingRows = [{ qtyUnitText: '', name: '' }];
    renderIngRows();
  }

  document.getElementById('saveBtn').onclick = async () => {
    const title = document.getElementById('f_title').value.trim();
    const errEl = document.getElementById('formError');
    errEl.textContent = '';

    if (!title) {
      errEl.textContent = "Le titre est obligatoire.";
      return;
    }

    const tags = document.getElementById('f_tags').value
      .split(',').map(t => t.trim()).filter(Boolean);

    const ingredients = ingRows
      .filter(ing => ing.name && ing.name.trim())
      .map(ing => {
        const { quantity, unit } = parseQtyUnit(ing.qtyUnitText);
        return {
          name: canonicalizeIngredientName(ing.name),
          quantity,
          unit
        };
      });

    const steps = document.getElementById('f_steps').value
      .split('\n').map(s => s.trim()).filter(Boolean);

    const payload = {
      title,
      photo_url: document.getElementById('f_photo').value.trim() || null,
      tags,
      servings: Number(document.getElementById('f_servings').value) || 4,
      cook_time_minutes: document.getElementById('f_cook').value ? Number(document.getElementById('f_cook').value) : null,
      oven_temp_celsius: document.getElementById('f_oven').value ? Number(document.getElementById('f_oven').value) : null,
      notes: document.getElementById('f_notes').value.trim() || null,
      ingredients,
      steps
    };

    document.getElementById('saveBtn').textContent = "Enregistrement...";
    document.getElementById('saveBtn').disabled = true;

    const { error } = editingId
      ? await sb.from('recipes').update(payload).eq('id', editingId)
      : await sb.from('recipes').insert(payload);

    document.getElementById('saveBtn').textContent = "Enregistrer la recette";
    document.getElementById('saveBtn').disabled = false;

    if (error) {
      errEl.textContent = "Erreur lors de l'enregistrement : " + error.message;
      console.error(error);
      return;
    }

    resetForm();
    await loadRecipes();
    showHome();
  };

  resetForm();

  // ---- Planning (sélection par compteur) ----
  let mealPlan = {}; // { recipe_id: count }

  async function loadMealPlan() {
    const { data, error } = await sb.from('meal_plan').select('*');
    if (error) { console.error(error); return; }
    mealPlan = {};
    (data || []).forEach(row => { mealPlan[row.recipe_id] = row.count; });
  }

  function renderPlanningRecipes() {
    // Résumé par tag
    const tagCounts = {};
    recipes.forEach(r => {
      const count = mealPlan[r.id] || 0;
      if (count > 0) {
        (r.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + count; });
      }
    });
    const summaryEl = document.getElementById('planSummary');
    const chips = Object.entries(tagCounts);
    summaryEl.innerHTML = chips.length
      ? chips.map(([tag, n]) => `<span class="summary-chip">${n} × #${tag}</span>`).join('')
      : '<span style="font-size:13px;color:#999;">Aucune recette sélectionnée pour l\'instant.</span>';

    // Liste des recettes avec stepper
    const listEl = document.getElementById('planningRecipeList');
    listEl.innerHTML = recipes.map(r => {
      const count = mealPlan[r.id] || 0;
      return `
        <div class="plan-recipe-row">
          <div>
            <div class="plan-recipe-name">${r.title}</div>
            <div class="plan-recipe-tags">${(r.tags || []).map(t => '#' + t).join(' ')}</div>
          </div>
          <div class="plan-stepper">
            <button type="button" data-plan-recipe="${r.id}" data-delta="-1">−</button>
            <span data-plan-count="${r.id}">${count}</span>
            <button type="button" data-plan-recipe="${r.id}" data-delta="1">+</button>
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('[data-plan-recipe]').forEach(btn => {
      btn.onclick = async (e) => {
        const recipeId = e.target.dataset.planRecipe;
        const delta = Number(e.target.dataset.delta);
        const newVal = Math.max(0, (mealPlan[recipeId] || 0) + delta);
        mealPlan[recipeId] = newVal;

        if (newVal === 0) {
          await sb.from('meal_plan').delete().eq('recipe_id', recipeId);
        } else {
          await sb.from('meal_plan').upsert({ recipe_id: recipeId, count: newVal });
        }
        renderPlanningRecipes();
      };
    });
  }

  function normalize(str) {
    return (str || '')
      .toLowerCase()
      .trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // retire les accents
  }

  function renderCoursesList() {
    const aggregated = {}; // key: normalized name -> { displayName, units: { unitKey: { label, quantity } } }
    let hasAnySelection = false;

    recipes.forEach(r => {
      const count = mealPlan[r.id] || 0;
      if (count === 0) return;
      hasAnySelection = true;
      (r.ingredients || []).forEach(ing => {
        const nameKey = normalize(ing.name).replace(/s$/, '');
        const unitKey = normalize(ing.unit);
        const scaledQty = ing.quantity != null ? ing.quantity * count : null;

        if (!aggregated[nameKey]) {
          aggregated[nameKey] = { displayName: ing.name.trim(), units: {} };
        }
        if (!aggregated[nameKey].units[unitKey]) {
          aggregated[nameKey].units[unitKey] = { label: ing.unit || '', quantity: scaledQty };
        } else if (scaledQty != null) {
          aggregated[nameKey].units[unitKey].quantity = (aggregated[nameKey].units[unitKey].quantity || 0) + scaledQty;
        }
      });
    });

    const listEl = document.getElementById('coursesList');
    if (!hasAnySelection) {
      listEl.innerHTML = '<div class="empty">Sélectionne des recettes dans l\'onglet "Recettes" pour générer ta liste de courses.</div>';
      return;
    }
    const items = Object.values(aggregated).sort((a, b) => a.displayName.localeCompare(b.displayName));
    listEl.innerHTML = items.map((item, idx) => {
      const qtyParts = Object.values(item.units).map(u => {
        if (u.quantity == null) return u.label;
        const qDisplay = Number.isInteger(u.quantity) ? u.quantity : u.quantity.toFixed(1).replace(/[.]0$/, '');
        return `${qDisplay} ${u.label}`.trim();
      }).filter(Boolean);
      return `
        <label class="course-item" id="course-${idx}">
          <input type="checkbox" onchange="document.getElementById('course-${idx}').classList.toggle('checked', this.checked)" />
          <span>${item.displayName}</span>
          <span class="course-qty">${qtyParts.join(' + ')}</span>
        </label>
      `;
    }).join('');
  }

  document.getElementById('subtabRecipes').onclick = () => {
    document.getElementById('subtabRecipes').classList.add('active');
    document.getElementById('subtabCourses').classList.remove('active');
    document.getElementById('planningRecipesPanel').style.display = 'block';
    document.getElementById('planningCoursesPanel').style.display = 'none';
    renderPlanningRecipes();
  };

  document.getElementById('subtabCourses').onclick = () => {
    document.getElementById('subtabCourses').classList.add('active');
    document.getElementById('subtabRecipes').classList.remove('active');
    document.getElementById('planningCoursesPanel').style.display = 'block';
    document.getElementById('planningRecipesPanel').style.display = 'none';
    renderCoursesList();
  };

  loadMealPlan();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  loadRecipes();
</script>
</body>
