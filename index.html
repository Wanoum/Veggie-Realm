<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Veggie Realm</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f7f3eb" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="tokens.css" />
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    background: var(--surface-low);
    color: var(--text-icon-primary);
    margin: 0;
    padding: calc(var(--space-page-edge) + env(safe-area-inset-top)) var(--space-page-edge) 100px;
  }
  .serif { font-family: 'Krylon', Georgia, serif; }
  h1 { font-family: 'Krylon', Georgia, serif; font-size: 48px; line-height: 100%; font-weight: 400; margin: 0 0 var(--space-section-gap); color: var(--text-icon-primary); }
  h2 { font-family: 'Inter', sans-serif; font-size: 24px; line-height: 120%; font-weight: 600; margin: var(--space-section-gap) 0 12px; color: var(--text-icon-primary); }
  .count { font-size: 13px; color: var(--text-icon-secondary); margin-bottom: 14px; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 999px;
    background: var(--surface-high);
    border: 1px solid var(--border-divider);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .icon-btn-lg { width: 48px; height: 48px; border: none; }
  .card { cursor: pointer; }
  .mini-card {
    flex: 0 0 120px;
    cursor: pointer;
  }
  .mini-card-photo {
    height: 90px;
    border-radius: 14px;
    background: var(--surface-low);
    overflow: hidden;
    margin-bottom: 6px;
  }
  .mini-card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .mini-card p { font-size: 12px; font-weight: 600; margin: 0; line-height: 1.3; color: var(--text-icon-primary); }
  .card-photo {
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    background: var(--surface-low);
    margin-bottom: 8px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo-empty {
    width: 100%; height: 100%;
    background: var(--surface-lowest);
    display: flex; align-items: center; justify-content: center;
  }
  .photo-empty i { font-size: 32px; color: var(--text-icon-secondary); }
  .card h3 { margin: 0 0 6px; font-family: 'Inter', sans-serif; font-size: 18px; line-height: 120%; font-weight: 500; color: var(--text-icon-primary); }
  .card-thumb { display: none; }
  .meta-pill {
    font-size: 14px;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--surface-lowest);
    color: var(--text-icon-primary);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    font-size: 14px;
    background: var(--surface-lowest);
    color: var(--text-icon-primary);
    padding: 3px 9px;
    border-radius: 20px;
  }
  #backBtn {
    background: var(--surface-highest);
    border: 1px solid var(--border-divider);
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    margin-bottom: 12px;
    color: var(--text-icon-primary);
  }
  .detail-photo {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 400px;
    background: var(--surface-high);
    overflow: hidden;
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail-sheet {
    position: relative;
    margin-top: 360px;
    background: var(--surface-high);
    border-radius: 22px 22px 0 0;
    padding: 12px 16px 24px;
    min-height: calc(100vh - 360px);
  }
  .detail-sheet-handle {
    width: 36px; height: 4px;
    background: var(--border-strong);
    border-radius: 4px;
    margin: 0 auto 20px;
  }
  .cooking-step {
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    padding: 24px 28px;
    cursor: pointer;
  }
  .cooking-step p {
    font-family: 'Krylon', Georgia, serif;
    margin: 0;
    transition: font-size 0.25s ease, opacity 0.25s ease;
    font-size: 22px;
    line-height: 1.4;
    opacity: 0.3;
  }
  .cooking-step.active p {
    font-size: 34px;
    line-height: 1.35;
    opacity: 1;
  }
  .cooking-step .cooking-step-ingredients {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cooking-step.active .cooking-step-ingredients { display: flex; }
  .detail-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 40px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom,
      rgba(255, 253, 248, 0) 0px,
      rgba(255, 253, 248, 0.8) 40px,
      rgba(255, 253, 248, 0.8) 100%);
    z-index: 50;
  }
  .servings-stepper { display: flex; gap: 2px; }
  .servings-stepper button {
    width: 40px; height: 40px;
    border: none;
    background: var(--interaction-primary-pale);
    color: var(--text-icon-accent);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .servings-minus { border-radius: 32px 2px 2px 32px; }
  .servings-plus { border-radius: 2px 32px 32px 2px; }
  .servings-value {
    min-width: 40px; height: 40px;
    border-radius: 2px;
    background: var(--interaction-primary-pale);
    color: var(--text-icon-accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .ing-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid var(--border-divider);
  }
  .ing-row-name { font-family: 'Inter', sans-serif; font-size: 18px; line-height: 120%; color: var(--text-icon-primary); margin: 0; }
  .ing-row-note { color: var(--text-icon-secondary); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 120%; }
  .ing-row-qty { font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 120%; color: var(--text-icon-secondary); white-space: nowrap; margin-left: 12px; }
  ol { padding-left: 20px; }
  ol li { margin-bottom: 10px; line-height: 1.6; font-family: 'Inter', sans-serif; font-size: 18px; }
  .notice {
    background: var(--surface-lowest);
    color: var(--text-icon-primary);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 120%;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: var(--space-section-gap);
  }
  #bottomNav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    min-height: 56px;
    background: var(--surface-high);
    border-top: 1px solid var(--border-divider);
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-btn {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
  }
  .nav-icon-wrap {
    padding: 2px 8px;
    border-radius: 999px;
  }
  .nav-btn.active .nav-icon-wrap { background: var(--interaction-primary-pale); padding: 2px 12px; }
  .nav-icon { font-size: 24px; line-height: 1; color: var(--text-icon-secondary); }
  .nav-btn.active .nav-icon { color: var(--text-icon-accent); }
  .nav-label { font-size: 14px; line-height: 120%; font-weight: 400; color: var(--text-icon-secondary); }
  .nav-btn.active .nav-label { font-weight: 500; color: var(--text-icon-accent); }
  .icon { font-size: 20px; line-height: 1; color: var(--text-icon-primary); }
  .fab-search {
    position: fixed;
    bottom: calc(56px + env(safe-area-inset-bottom));
    right: 22px;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--interaction-primary);
    color: white;
    border: none;
    font-size: 18px;
    box-shadow: none;
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty { text-align: center; color: var(--text-icon-secondary); padding: 40px 0; font-size: 14px; grid-column: 1 / -1; }
  .field-label { display:block; font-size:13px; color:var(--text-icon-secondary); margin:14px 0 4px; }
  .field-input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border-divider);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    line-height: 120%;
    background: var(--surface-highest);
    color: var(--text-icon-primary);
  }
  .secondary-btn {
    width: 100%;
    height: 56px;
    padding: 0 14px;
    margin-top: 8px;
    border: 1px solid var(--border-strong);
    border-radius: 8px 16px 8px 16px;
    background: var(--interaction-primary-pale);
    font-family: 'Inter', sans-serif;
    color: var(--text-icon-accent);
    font-size: 18px;
    line-height: 120%;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .primary-btn {
    width: 100%;
    height: 56px;
    padding: 0 14px;
    margin-top: var(--space-section-gap);
    border: none;
    border-radius: 16px 8px 16px 8px;
    background: var(--interaction-primary);
    color: var(--text-icon-on-primary);
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    line-height: 120%;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-square { width: 56px; flex: 0 0 56px; padding: 0; }
  .row-item {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-item input, .row-item select {
    padding: 10px 12px;
    border: 1px solid var(--border-divider);
    border-radius: 12px;
    font-size: 15px;
    background: var(--surface-highest);
  }
  .row-item input { flex: 2; min-width: 0; }
  .row-item .qty-input { flex: 1; }
  .row-item .unit-input { flex: 1.3; }
  .remove-row {
    background: none;
    border: none;
    color: #B3261E;
    font-size: 18px;
    padding: 4px 8px;
  }
  .step-item textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-divider);
    border-radius: 12px;
    font-size: 14px;
    resize: vertical;
    min-height: 44px;
  }
  .day-row {
    background: var(--surface-highest);
    border: 1px solid var(--border-divider);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .day-row .day-name { font-size: 13px; color: var(--text-icon-secondary); margin-bottom: 6px; text-transform: capitalize; }
  .day-row select { width: 100%; padding: 9px 10px; border: 1px solid var(--border-divider); border-radius: 10px; font-size: 14px; background: var(--surface-highest); margin-bottom: 6px; }
  .day-row .servings-mini { display: flex; align-items: center; gap: 10px; }
  .day-row .servings-mini button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-divider); background: var(--surface-highest); font-size: 14px; }
  .course-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-top: 1px solid var(--border-divider);
    font-size: 14px;
  }
  .course-item:first-child { border-top: none; }
  .course-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--interaction-primary); }
  .course-item.checked { color: var(--text-icon-secondary); text-decoration: line-through; }
  .course-qty { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 18px; line-height: 120%; color: var(--text-icon-secondary); white-space: nowrap; }
  .subtabs, .tag-filters, .segmented {
    display: flex;
    gap: 4px;
    margin: 0 0 var(--space-section-gap);
  }
  .subtab-btn, .filter-chip {
    flex: 1;
    height: 48px;
    padding: 0 10px;
    border: none;
    background: var(--interaction-primary-pale);
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 120%;
    font-weight: 400;
    color: var(--text-icon-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }
  .subtab-btn.active, .filter-chip.active {
    background: var(--interaction-primary);
    color: var(--text-icon-on-primary);
    border-radius: 999px;
    font-weight: 500;
  }
  .filter-chip-vertical {
    flex-direction: column;
    height: 68px;
    gap: 4px;
  }
  .plan-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .meal-category-card {
    background: var(--interaction-primary-pale);
    border-radius: 16px;
    padding: 14px 6px;
    text-align: center;
  }
  .meal-category-number { font-family: 'IBM Plex Mono', monospace; font-size: 40px; line-height: 40%; font-weight: 400; color: var(--text-icon-primary); margin: 0; }
  .meal-category-label { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 120%; color: var(--text-icon-primary); margin: 8px 0 0; }
  .plan-recipe-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-highest);
    border: 1px solid var(--border-divider);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .plan-recipe-row .plan-recipe-name { font-size: 14px; font-weight: 500; }
  .plan-recipe-row .plan-recipe-tags { font-size: 14px; color: var(--text-icon-secondary); margin-top: 2px; }
  .plan-stepper { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .plan-stepper button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-divider); background: var(--surface-highest); font-size: 15px; }
  .plan-stepper span { min-width: 14px; text-align: center; font-weight: 600; }
  .autocomplete-box {
    position: absolute;
    background: var(--surface-highest);
    border: 1px solid var(--border-divider);
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    z-index: 200;
    max-height: 160px;
    overflow-y: auto;
  }
  .autocomplete-item {
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .autocomplete-item:hover, .autocomplete-item.highlighted { background: var(--surface-low); }
</style>
</head>
<body>

<div id="authView" style="display:none;padding-top:60px;">
  <h1 class="serif" style="font-size:30px;text-align:center;">Veggie Realm</h1>
  <p style="text-align:center;color:var(--text-icon-primary);margin-bottom:24px;">Connecte-toi pour retrouver tes recettes</p>

  <div style="max-width:340px;margin:0 auto;">
    <div class="subtabs">
      <button type="button" id="authTabLogin" class="subtab-btn active">Connexion</button>
      <button type="button" id="authTabSignup" class="subtab-btn">Inscription</button>
    </div>

    <label class="field-label">Email</label>
    <input id="auth_email" class="field-input" type="email" placeholder="toi@exemple.com" autocomplete="email" />

    <label class="field-label">Mot de passe</label>
    <input id="auth_password" class="field-input" type="password" placeholder="••••••••" autocomplete="current-password" />

    <p id="authError" style="color:#B3261E;font-size:13px;margin-top:10px;"></p>

    <button type="button" id="authSubmitBtn" class="primary-btn">Se connecter</button>
    <button type="button" id="forgotPasswordBtn" style="width:100%;background:none;border:none;padding:14px;color:var(--text-icon-primary);font-size:14px;">Mot de passe oublié ?</button>
  </div>
</div>

<div id="resetPasswordView" style="display:none;padding-top:60px;">
  <h1 class="serif" style="font-size:26px;text-align:center;">Nouveau mot de passe</h1>
  <p style="text-align:center;color:var(--text-icon-primary);margin-bottom:24px;">Choisis un nouveau mot de passe pour ton compte</p>

  <div style="max-width:340px;margin:0 auto;">
    <label class="field-label">Nouveau mot de passe</label>
    <input id="reset_password" class="field-input" type="password" placeholder="••••••••" autocomplete="new-password" />

    <p id="resetError" style="color:#B3261E;font-size:13px;margin-top:10px;"></p>

    <button type="button" id="resetSubmitBtn" class="primary-btn">Enregistrer le mot de passe</button>
  </div>
</div>

<div id="sharedRecipeView" style="display:none;">
  <div id="sharedRecipeContent"></div>
</div>

<div id="pullIndicator" style="display:flex;justify-content:center;align-items:center;height:0;overflow:hidden;transition:height 0.15s;">
  <i class="bi bi-arrow-clockwise" id="pullIcon" style="font-size:20px;color:var(--text-icon-secondary);"></i>
</div>

<div id="listView" style="display:none;">
  <h1>Veggie Realm</h1>
  <div style="position:relative;display:none;margin:10px 0;" id="searchWrap">
    <input id="searchInput" class="field-input" placeholder="Rechercher une recette..." style="padding-right:40px;" />
    <button id="clearSearchBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;color:var(--text-icon-secondary);"><i class="bi bi-x-circle-fill"></i></button>
  </div>
  <div id="tagFilters" class="tag-filters"></div>

  <div id="savedRecipesSection" style="display:none;margin-bottom:20px;">
    <h2 style="margin:0 0 10px;font-size:15px;">Recettes partagées avec toi</h2>
    <div id="savedRecipesStrip" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;"></div>
  </div>

  <p class="count" id="count">Chargement...</p>
  <div id="cards" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;"></div>
</div>

<button id="searchFab" class="fab-search" style="display:none;"><i class="bi bi-search icon" style="color:white;"></i></button>

<div id="detailView" style="display:none;margin:calc(-1 * var(--space-page-edge)) calc(-1 * var(--space-page-edge)) 0;">
  <div id="detailContent"></div>
</div>

<div id="cookingModeView" style="display:none;position:fixed;inset:0;background:var(--text-icon-accent-strong);color:white;z-index:300;flex-direction:column;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:16px;padding-top:calc(16px + env(safe-area-inset-top));">
    <div>
      <p id="cookingRecipeTitle" style="font-family:'Inter',sans-serif;font-size:20px;line-height:120%;font-weight:600;margin:0 0 2px;"></p>
      <p id="cookingRecipeServings" style="font-family:'Inter',sans-serif;font-size:14px;line-height:120%;color:rgba(255,255,255,0.7);margin:0;"></p>
    </div>
    <button class="icon-btn" style="background:var(--surface-high);border:none;" onclick="closeCookingMode()"><i class="bi bi-x-lg icon"></i></button>
  </div>
  <div id="cookingScroll" style="flex:1;overflow-y:auto;scroll-snap-type:y mandatory;"></div>
</div>

<div id="formView" style="display:none;">
  <button id="wizardTopBackBtn" class="icon-btn" style="display:none;margin-bottom:12px;" onclick="wizardGoBack()"><i class="bi bi-arrow-left icon"></i></button>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <h1 id="formTitle" style="margin-bottom:0;">Nouvelle recette</h1>
    <span id="wizardStepLabel" class="text-small" style="color:var(--text-icon-secondary);"></span>
  </div>

  <!-- Étape 1 : source -->
  <div id="wizardStep1" class="wizard-step">
    <p class="text-body" style="margin:0 0 16px;">Comment veux-tu ajouter cette recette ?</p>
    <button type="button" class="secondary-btn" style="margin-bottom:10px;" onclick="chooseNewRecipe()"><i class="bi bi-pencil"></i> Créer une nouvelle recette</button>
    <button type="button" class="secondary-btn" onclick="toggleImportPanel()"><i class="bi bi-link-45deg"></i> Importer depuis un site web</button>

    <div id="importPanel" style="display:none;margin-top:16px;">
      <label class="field-label">Lien de la recette</label>
      <input id="import_url" class="field-input" placeholder="https://www.exemple.com/recette..." />
      <button type="button" id="importFetchBtn" class="primary-btn" onclick="performImport()">Récupérer la recette</button>
      <p id="importStatus" style="font-size:14px;color:var(--text-icon-secondary);margin-top:8px;"></p>
    </div>
  </div>

  <!-- Étape 2 : informations -->
  <div id="wizardStep2" class="wizard-step" style="display:none;">
    <label class="field-label">Titre</label>
    <input id="f_title" class="field-input" placeholder="Ex: Gâteau au yaourt" />

    <label class="field-label">Photo</label>
    <div id="photoPreviewWrap" style="display:none;margin-bottom:8px;position:relative;">
      <img id="photoPreview" style="width:100%;height:160px;object-fit:cover;border-radius:12px;" />
      <button type="button" id="removePhotoBtn" class="icon-btn" style="position:absolute;top:8px;right:8px;"><i class="bi bi-trash icon"></i></button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bhsftmcluaqztkfnwobx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoc2Z0bWNsdWFxenRrZm53b2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTE1ODgsImV4cCI6MjEwNDc4NzU4OH0.ovrCW7IRhkH8tfMYyExNp6zKt60EJMpJLcehlastIAI";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let recipes = [];
  let currentServings = {};

  async function loadRecipes() {
    const { data, error } = await sb.from('recipes').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false });
    if (error) {
      document.getElementById('count').textContent = "Erreur de chargement";
      console.error(error);
      return;
    }
    recipes = data;
    renderList();
    loadSavedRecipes();
  }

  let activeTagFilter = null;
  let searchQuery = '';

  function renderTagFilters() {
    const container = document.getElementById('tagFilters');
    container.innerHTML = MEAL_TYPES.map(t => `
      <button type="button" class="filter-chip filter-chip-vertical ${activeTagFilter === t ? 'active' : ''}" data-tag="${t}"><i class="bi ${MEAL_TYPE_ICONS[t]}" style="font-size:24px;"></i>${t}</button>
    `).join('');
    container.querySelectorAll('.filter-chip').forEach(chip => {
      chip.onclick = () => {
        const tag = chip.dataset.tag;
        activeTagFilter = (activeTagFilter === tag) ? null : tag;
        renderList();
      };
    });
  }

  function getFilteredIndices() {
    return recipes
      .map((r, i) => i)
      .filter(i => {
        const r = recipes[i];
        const matchesSearch = !searchQuery || r.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = !activeTagFilter || (r.tags || []).includes(activeTagFilter);
        return matchesSearch && matchesTag;
      });
  }

  function renderList() {
    renderTagFilters();
    const filteredIndices = getFilteredIndices();
    document.getElementById('count').textContent = '';
    const cardsEl = document.getElementById('cards');
    if (recipes.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucune recette pour l\'instant.</div>';
      return;
    }
    if (filteredIndices.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucun résultat pour ces critères.</div>';
      return;
    }
    cardsEl.innerHTML = filteredIndices.map(i => {
      const r = recipes[i];
      const totalTime = r.cook_time_minutes || 0;
      return `
      <div class="card" onclick="showDetail(${i})">
        <div class="card-photo">
          ${r.photo_url
            ? `<img src="${r.photo_url}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;photo-empty&quot;><i class=&quot;bi bi-image&quot;></i></div>'" />`
            : '<div class="photo-empty"><i class="bi bi-image"></i></div>'}
        </div>
        <h3>${r.title}</h3>
        ${totalTime > 0 ? `<span class="meta-pill"><i class="bi bi-clock" style="font-size:13px;color:var(--text-icon-primary);"></i> ${totalTime} min</span>` : ''}
      </div>
    `;
    }).join('');
  }

  document.getElementById('searchFab').onclick = () => {
    const wrap = document.getElementById('searchWrap');
    const input = document.getElementById('searchInput');
    const showing = wrap.style.display !== 'none';
    wrap.style.display = showing ? 'none' : 'block';
    if (!showing) input.focus();
  };

  document.getElementById('clearSearchBtn').onclick = () => {
    const input = document.getElementById('searchInput');
    input.value = '';
    searchQuery = '';
    renderList();
    input.focus();
  };

  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    renderList();
  };

  let currentDetailIndex = null;

  function showDetail(i) {
    window.scrollTo(0, 0);
    currentDetailIndex = i;
    const r = recipes[i];
    currentServings[i] = r.servings || 4;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
    document.body.style.background = 'var(--surface-high)';
    renderDetail(i);
    sessionStorage.setItem('lastView', 'detail');
    sessionStorage.setItem('lastDetailRecipeId', r.id);
  }

  function renderDetail(i) {
    const r = recipes[i];
    const base = r.servings || 4;
    const s = currentServings[i];
    const metaPills = [];
        if (r.cook_time_minutes) metaPills.push(`<span class="meta-pill"><i class="bi bi-fire" style="font-size:13px;color:var(--text-icon-primary);"></i> ${r.cook_time_minutes} min</span>`);
    if (r.oven_temp_celsius) metaPills.push(`<span class="meta-pill"><i class="bi bi-thermometer-half" style="font-size:13px;color:var(--text-icon-primary);"></i> ${r.oven_temp_celsius}°</span>`);

    const sortedIngredients = [...(r.ingredients || [])].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const ingredientsHtml = sortedIngredients.map(ing => {
      const q = ing.quantity != null ? (ing.quantity * s / base) : null;
      const qDisplay = q != null ? (Number.isInteger(q) ? q : q.toFixed(1).replace(/[.]0$/, '')) : '';
      return `
      <div class="ing-row">
        <span class="ing-row-name">${ing.name}${ing.note ? ' <span class="ing-row-note">(' + ing.note + ')</span>' : ''}</span>
        <span class="ing-row-qty">${qDisplay} ${ing.unit || ''}</span>
      </div>`;
    }).join('');

    const stepsHtml = (r.steps && r.steps.length > 0)
      ? '<h2>Étapes</h2><ol>' + r.steps.map(st => `<li>${st}</li>`).join('') + '</ol>'
      : '';

    const hasSteps = r.steps && r.steps.length > 0;

    document.getElementById('detailContent').innerHTML = `
      <div class="detail-photo">
        ${r.photo_url
          ? `<img src="${r.photo_url}" alt="" onerror="this.parentElement.querySelector('img').style.display='none'" />`
          : '<div class="photo-empty"><i class="bi bi-image" style="font-size:48px;"></i></div>'}
        <button class="icon-btn icon-btn-lg" style="position:absolute;top:calc(18px + env(safe-area-inset-top));left:18px;" onclick="goBackFromDetail()"><i class="bi bi-arrow-left icon"></i></button>
        <div style="position:absolute;top:calc(18px + env(safe-area-inset-top));right:18px;display:flex;gap:8px;">
          <button class="icon-btn icon-btn-lg" onclick="shareCurrentRecipe(${i})"><i class="bi bi-share icon"></i></button>
          <button class="icon-btn icon-btn-lg" onclick="editCurrentRecipe()"><i class="bi bi-pencil icon"></i></button>
          <button class="icon-btn icon-btn-lg" onclick="deleteCurrentRecipe()"><i class="bi bi-trash icon"></i></button>
        </div>
      </div>
      <div class="detail-sheet">
        <div class="detail-sheet-handle"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:var(--space-section-gap);">
          ${metaPills.join('')}
          ${(r.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <h1 style="margin-bottom:var(--space-section-gap);">${r.title}</h1>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-section-gap);">
          <span class="text-body">Portions</span>
          <div class="servings-stepper">
            <button class="servings-minus" onclick="changeServings(${i}, -1)"><i class="bi bi-dash"></i></button>
            <span class="servings-value">${s}</span>
            <button class="servings-plus" onclick="changeServings(${i}, 1)"><i class="bi bi-plus"></i></button>
          </div>
        </div>

        <h2>Ingrédients</h2>
        ${ingredientsHtml}
        ${r.notes ? `<div class="notice">${r.notes}</div>` : ''}
        ${stepsHtml}
        ${r.source_url ? `<p style="margin-top:var(--space-section-gap);"><a href="${r.source_url}" target="_blank" rel="noopener" style="color:var(--text-icon-accent);font-size:14px;">Source : ${new URL(r.source_url).hostname.replace('www.', '')}</a></p>` : ''}
        <div style="height:90px;"></div>
      </div>

      <div class="detail-footer">
        <button type="button" class="secondary-btn btn-square" style="margin-top:0;" onclick="addCurrentRecipeToPlanning('${r.id}')"><i class="bi bi-calendar-plus" style="font-size:20px;"></i></button>
        ${hasSteps ? `<button type="button" class="primary-btn" style="margin-top:0;" onclick="openCookingMode(${i})">Cook mode</button>` : ''}
      </div>
    `;
  }

  async function addCurrentRecipeToPlanning(recipeId) {
    const selectedServings = currentServings[currentDetailIndex] || 1;
    const newVal = (mealPlan[recipeId] || 0) + selectedServings;
    mealPlan[recipeId] = newVal;
    await sb.from('meal_plan').upsert({ recipe_id: recipeId, count: newVal, user_id: currentUser.id });
  }

  function changeServings(i, delta) {
    const newVal = currentServings[i] + delta;
    if (newVal < 1) return;
    currentServings[i] = newVal;
    renderDetail(i);
  }

  function goBackFromDetail() {
    window.scrollTo(0, 0);
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('searchFab').style.display = 'block';
    document.body.style.background = '';
  }

  // ---- Mode cuisine plein écran ----
  let cookingSteps = [];
  let cookingStepIndex = 0;
  let cookingRecipe = null;
  let wakeLock = null;

  async function openCookingMode(i) {
    const r = recipes[i];
    cookingRecipe = r;
    cookingSteps = r.steps || [];
    if (cookingSteps.length === 0) return;
    cookingStepIndex = 0;

    document.getElementById('cookingRecipeTitle').textContent = r.title;
    document.getElementById('cookingRecipeServings').textContent = `pour ${currentServings[i] || r.servings || 4} portions`;
    document.getElementById('cookingModeView').style.display = 'flex';
    renderCookingSteps();

    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* ignoré */ }
    }
  }

  function ingredientChipsForStep(stepText) {
    if (!cookingRecipe) return '';
    const base = cookingRecipe.servings || 4;
    const target = currentServings[currentDetailIndex] || base;
    const normalizedStep = normalize(stepText);
    const matches = (cookingRecipe.ingredients || []).filter(ing => normalizedStep.includes(normalize(ing.name)));
    return matches.map(ing => {
      const q = ing.quantity != null ? (ing.quantity * target / base) : null;
      const qDisplay = q != null ? (Number.isInteger(q) ? q : q.toFixed(1).replace(/[.]0$/, '')) : '';
      return `<span class="meta-pill" style="background:rgba(255,255,255,0.18);color:white;font-size:14px;padding:8px 14px;"><i class="bi bi-stars"></i> ${qDisplay} ${ing.unit || ''} ${ing.name}</span>`;
    }).join('');
  }

  function renderCookingSteps() {
    const scrollEl = document.getElementById('cookingScroll');
    const spacerHeight = Math.round(scrollEl.clientHeight / 2);
    scrollEl.innerHTML = `
      <div style="height:${spacerHeight}px;"></div>
      ${cookingSteps.map((stepText, idx) => `
        <div class="cooking-step" data-step-idx="${idx}" onclick="scrollToCookingStep(${idx})">
          <p>${stepText}</p>
          <div class="cooking-step-ingredients">${ingredientChipsForStep(stepText)}</div>
        </div>
      `).join('')}
      <div style="height:${spacerHeight}px;"></div>
    `;

    updateActiveCookingStep();
    scrollEl.onscroll = () => {
      window.requestAnimationFrame(updateActiveCookingStep);
    };

    // Positionne sur la première étape sans animation
    scrollEl.querySelector('.cooking-step').scrollIntoView({ block: 'center' });
  }

  function updateActiveCookingStep() {
    const scrollEl = document.getElementById('cookingScroll');
    const center = scrollEl.scrollTop + scrollEl.clientHeight / 2;
    let closestIdx = 0;
    let closestDist = Infinity;
    scrollEl.querySelectorAll('.cooking-step').forEach((el, idx) => {
      const dist = Math.abs((el.offsetTop + el.offsetHeight / 2) - center);
      if (dist < closestDist) { closestDist = dist; closestIdx = idx; }
    });
    if (closestIdx !== cookingStepIndex) {
      cookingStepIndex = closestIdx;
    }
    scrollEl.querySelectorAll('.cooking-step').forEach((el, idx) => {
      el.classList.toggle('active', idx === closestIdx);
    });
  }

  function scrollToCookingStep(idx) {
    const scrollEl = document.getElementById('cookingScroll');
    const target = scrollEl.querySelectorAll('.cooking-step')[idx];
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function closeCookingMode() {
    document.getElementById('cookingModeView').style.display = 'none';
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  function updateNavIcons() {
    document.querySelectorAll('.nav-btn .nav-icon').forEach(icon => {
      const isActive = icon.closest('.nav-btn').classList.contains('active');
      icon.className = `bi ${isActive ? icon.dataset.filled : icon.dataset.outline} nav-icon`;
    });
  }

  function hideAllViews() {
    discardAbandonedPhoto();
    document.body.style.background = '';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('planningView').style.display = 'none';
    document.getElementById('accountView').style.display = 'none';
    document.getElementById('sharedRecipeView').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
    document.getElementById('navHome').classList.remove('active');
    document.getElementById('navAdd').classList.remove('active');
    document.getElementById('navPlanning').classList.remove('active');
    document.getElementById('navAccount').classList.remove('active');
  }

  function showHome() {
    window.scrollTo(0, 0);
    hideAllViews();
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('searchFab').style.display = 'block';
    document.getElementById('navHome').classList.add('active');
    updateNavIcons();
    sessionStorage.setItem('lastView', 'home');
  }

  function showForm() {
    window.scrollTo(0, 0);
    hideAllViews();
    document.getElementById('formView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navAdd').classList.add('active');
    updateNavIcons();
    resetForm();
    goToWizardStep(1);
    sessionStorage.setItem('lastView', 'form');
  }

  // ---- Navigation du parcours d'ajout en 4 étapes ----
  let wizardStep = 1;
  let importedSourceUrl = null;
  const wizardStepLabels = ['', 'Source', 'Infos', 'Ingrédients', 'Étapes'];

  function goToWizardStep(step) {
    wizardStep = step;
    window.scrollTo(0, 0);
    for (let s = 1; s <= 4; s++) {
      document.getElementById('wizardStep' + s).style.display = (s === step) ? 'block' : 'none';
    }
    document.getElementById('wizardStepLabel').textContent = (editingId || step === 1)
      ? ''
      : `Étape ${step - 1} / 3 · ${wizardStepLabels[step]}`;
    document.getElementById('wizardTopBackBtn').style.display = (step > 1) ? 'flex' : 'none';
    document.getElementById('bottomNav').style.display = (step === 1) ? 'flex' : 'none';
    document.getElementById('searchFab').style.display = 'none';
    document.getElementById('wizardNextBtn').textContent = (step === 4) ? 'Enregistrer la recette' : 'Suivant';
    document.getElementById('formError').textContent = '';
  }

  function wizardGoBack() {
    if (wizardStep > 1) goToWizardStep(wizardStep - 1);
  }

  function chooseNewRecipe() {
    goToWizardStep(2);
  }

  function toggleImportPanel() {
    const panel = document.getElementById('importPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  async function performImport() {
    const url = document.getElementById('import_url').value.trim();
    const statusEl = document.getElementById('importStatus');
    const btn = document.getElementById('importFetchBtn');
    statusEl.style.color = 'var(--text-icon-secondary)';
    statusEl.textContent = '';

    if (!url) {
      statusEl.style.color = '#B3261E';
      statusEl.textContent = "Colle d'abord un lien.";
      return;
    }

    btn.disabled = true;
    statusEl.textContent = "Récupération de la recette...";

    try {
      const response = await fetch(`/api/import-recipe?url=${encodeURIComponent(url)}`);
      const data = await response.json();

      if (!response.ok) {
        statusEl.style.color = '#B3261E';
        statusEl.textContent = data.error || "Erreur lors de l'import.";
        btn.disabled = false;
        return;
      }

      // Préremplit les champs avec les données importées
      importedSourceUrl = data.source_url || url;
      document.getElementById('f_title').value = data.title || '';
      document.getElementById('f_photo').value = data.photo_url || '';
      updatePhotoPreview(data.photo_url || null);
      document.getElementById('f_servings').value = data.servings || 4;
      document.getElementById('f_cook').value = data.cook_time_minutes || '';
      document.getElementById('f_oven').value = data.oven_temp_celsius || '';

      ingRows = (data.ingredients || []).map(ing => ({
        qtyUnitText: [ing.quantity, ing.unit].filter(v => v != null && v !== '').join(' '),
        name: ing.name || ''
      }));
      if (ingRows.length === 0) ingRows = [{ qtyUnitText: '', name: '' }];
      renderIngRows();

      document.getElementById('f_steps').value = (data.steps || []).join('\n');

      statusEl.style.color = '#3D5A34';
      statusEl.textContent = "Recette importée ! Vérifie et complète les informations ci-dessous.";
      btn.disabled = false;

      setTimeout(() => goToWizardStep(2), 600);

  // ---- Tirer pour rafraîchir (pull-to-refresh) ----
  (function setupPullToRefresh() {
    const indicator = document.getElementById('pullIndicator');
    const icon = document.getElementById('pullIcon');
    const threshold = 70;
    let startY = null;
    let pulling = false;

    function isOnHome() {
      return document.getElementById('listView').style.display !== 'none';
    }

    document.addEventListener('touchstart', (e) => {
      if (!isOnHome()) { startY = null; pulling = false; return; }
      if ((window.scrollY || document.documentElement.scrollTop || 0) > 0) { startY = null; pulling = false; return; }
      startY = e.touches[0].clientY;
      pulling = true;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!pulling || startY == null) return;
      const diff = e.touches[0].clientY - startY;
      if (diff > 0 && (window.scrollY || document.documentElement.scrollTop || 0) === 0) {
        const height = Math.min(diff * 0.5, 70);
        indicator.style.height = height + 'px';
        icon.style.transform = `rotate(${height * 4}deg)`;
      }
    }, { passive: true });

    document.addEventListener('touchend', async () => {
      if (!pulling) return;
      pulling = false;
      const currentHeight = parseInt(indicator.style.height) || 0;
      if (currentHeight >= threshold * 0.5) {
        indicator.style.height = '50px';
        icon.className = 'bi bi-arrow-repeat';
        icon.style.animation = 'spin 0.6s linear infinite';
        await Promise.all([loadRecipes(), loadMealPlan()]);
        icon.style.animation = '';
        icon.className = 'bi bi-arrow-clockwise';
        indicator.style.height = '0';
      } else {
        indicator.style.height = '0';
      }
      startY = null;
    }, { passive: true });
  })();

  // ---- Normalisation ingrédients / unités ----
  const UNIT_CANON = {
    'paquet': 'sachet', 'paquets': 'sachet', 'sachets': 'sachet',
    'grammes': 'g', 'gramme': 'g',
    'kilo': 'kg', 'kilos': 'kg', 'kilogramme': 'kg', 'kilogrammes': 'kg',
    'litres': 'l', 'litre': 'l',
    'millilitres': 'ml', 'millilitre': 'ml',
    'cas': 'c.à.s', 'cuillere a soupe': 'c.à.s', 'cuillères à soupe': 'c.à.s', 'cuillere a soupes': 'c.à.s',
    'cac': 'c.à.c', 'cuillere a cafe': 'c.à.c', 'cuillères à café': 'c.à.c',
    'pieces': 'pièce', 'piece': 'pièce', 'pièces': 'pièce',
    'tasses': 'tasse',
    'pincees': 'pincée', 'pincee': 'pincée', 'pincées': 'pincée'
  };

  function canonicalizeUnit(raw) {
    if (!raw) return null;
    let u = normalize(raw); // lowercase, trim, sans accents
    if (UNIT_CANON[u]) return UNIT_CANON[u];
    // essaie sans le "s" final (pluriel simple) si pas déjà reconnu
    if (u.endsWith('s') && UNIT_CANON[u.slice(0, -1)]) return UNIT_CANON[u.slice(0, -1)];
    return raw.trim();
  }

  function canonicalizeIngredientName(raw) {
    const trimmed = raw.trim();
    const key = normalize(trimmed).replace(/s$/, ''); // ignore pluriel simple
    const known = getKnownIngredientNames();
    const match = known.find(n => normalize(n).replace(/s$/, '') === key);
    return match || trimmed;
  }

  function getKnownIngredientNames() {
    const set = new Set();
    recipes.forEach(r => (r.ingredients || []).forEach(ing => { if (ing.name) set.add(ing.name); }));
    return [...set];
  }

  function parseQtyUnit(text) {
    const t = (text || '').trim();
    if (!t) return { quantity: null, unit: null };
    const match = t.match(/^([\d]+[.,]?[\d]*)\s*(.*)$/);
    if (match) {
      const quantity = parseFloat(match[1].replace(',', '.'));
      const unitRaw = match[2].trim();
      return { quantity: isNaN(quantity) ? null : quantity, unit: unitRaw ? canonicalizeUnit(unitRaw) : null };
    }
    // pas de nombre trouvé : tout est traité comme une unité (ex: "pincée")
    return { quantity: null, unit: canonicalizeUnit(t) };
  }

  let acBox = null;

  function closeAutocomplete() {
    if (acBox) { acBox.remove(); acBox = null; }

  function openAutocomplete(inputEl, idx) {
    const query = normalize(inputEl.value);
    const seen = new Set();
    const matches = getKnownIngredientNames()
      .filter(n => {
        const norm = normalize(n);
        if (!query || !norm.includes(query) || norm === query) return false;
        const singularKey = norm.replace(/s$/, '');
        if (seen.has(singularKey)) return false;
        seen.add(singularKey);
        return true;
      })
      .slice(0, 6);

    closeAutocomplete();
    if (matches.length === 0) return;

    acBox = document.createElement('div');
    acBox.className = 'autocomplete-box';
    acBox.style.left = inputEl.offsetLeft + 'px';
    acBox.style.top = (inputEl.offsetTop + inputEl.offsetHeight + 2) + 'px';
    acBox.style.width = inputEl.offsetWidth + 'px';
    acBox.innerHTML = matches.map(n => `<div class="autocomplete-item" data-value="${n}">${n}</div>`).join('');
    inputEl.parentElement.appendChild(acBox);

    acBox.querySelectorAll('.autocomplete-item').forEach(item => {

  function compressImage(file, maxSize = 1280, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = Math.round(height * maxSize / width); width = maxSize; }
          else { width = Math.round(width * maxSize / height); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d', { colorSpace: 'srgb' }).drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', quality);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function extractStoragePath(url) {
    const marker = '/recipe-photos/';
    const idx = url.indexOf(marker);

    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
    const { error } = await sb.storage.from('recipe-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) {

      return;

    // Si une photo avait déjà été uploadée cette session sans être enregistrée, elle est orpheline : on la supprime.
    if (currentSessionUploadPath) {

  async function saveRecipe() {
    const title = document.getElementById('f_title').value.trim();

    const ingredients = ingRows
      .filter(ing => ing.name && ing.name.trim())
      .map(ing => {
        const { quantity, unit } = parseQtyUnit(ing.qtyUnitText);

          quantity,
          unit

      });

    const steps = document.getElementById('f_steps').value
      .split('\n').map(s => s.trim()).filter(Boolean);

    const payload = {
      title,
      user_id: currentUser.id,
      photo_url: document.getElementById('f_photo').value.trim() || null,
      tags,
      servings: Number(document.getElementById('f_servings').value) || 4,

      oven_temp_celsius: document.getElementById('f_oven').value ? Number(document.getElementById('f_oven').value) : null,
      notes: document.getElementById('f_notes').value.trim() || null,

      steps

    const nextBtn = document.getElementById('wizardNextBtn');
    nextBtn.textContent = "Enregistrement...";
    nextBtn.disabled = true;

    const { error } = editingId
      ? await sb.from('recipes').update(payload).eq('id', editingId)
      : await sb.from('recipes').insert(payload);

    nextBtn.disabled = false;

    if (error) {
      errEl.textContent = "Erreur lors de l'enregistrement : " + error.message;
      nextBtn.textContent = "Enregistrer la recette";
      console.error(error);
      return;
    }

    // La sauvegarde a réussi : la nouvelle photo (si upload cette session) est désormais "officielle".
    currentSessionUploadPath = null;
    // Si l'ancienne photo (avant édition) a été remplacée ou retirée, elle est maintenant orpheline : on la supprime.
    if (originalPhotoUrlForSession && originalPhotoUrlForSession !== payload.photo_url) {
      const oldPath = extractStoragePath(originalPhotoUrlForSession);
      if (oldPath) sb.storage.from('recipe-photos').remove([oldPath]);
    }

    const wasEditing = editingId;
    resetForm();
    await loadRecipes();

    if (wasEditing) {
      const idx = recipes.findIndex(r => r.id === wasEditing);
      if (idx !== -1) { showDetail(idx); return; }

  function normalize(str) {
    return (str || '')
      .toLowerCase()
      .trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // retire les accents
  }

  function renderCoursesList() {
    const aggregated = {}; // key: normalized name -> { displayName, units: { unitKey: { label, quantity } } }
    let hasAnySelection = false;

    recipes.forEach(r => {
      const count = mealPlan[r.id] || 0;
      if (count === 0) return;
      hasAnySelection = true;
      const base = r.servings || 4;
      (r.ingredients || []).forEach(ing => {
        const nameKey = normalize(ing.name).replace(/s$/, '');
        const unitKey = normalize(ing.unit);
        const scaledQty = ing.quantity != null ? (ing.quantity * count / base) : null;

        if (!aggregated[nameKey]) {
          aggregated[nameKey] = { displayName: ing.name.trim(), units: {} };
        }
        if (!aggregated[nameKey].units[unitKey]) {
          aggregated[nameKey].units[unitKey] = { label: ing.unit || '', quantity: scaledQty };
        } else if (scaledQty != null) {
          aggregated[nameKey].units[unitKey].quantity = (aggregated[nameKey].units[unitKey].quantity || 0) + scaledQty;
        }
      });
    });

    const listEl = document.getElementById('coursesList');
    if (!hasAnySelection) {
      listEl.innerHTML = '<div class="empty">Sélectionne des recettes dans l\'onglet "Recettes" pour générer ta liste de courses.</div>';
      return;
    }
    const items = Object.values(aggregated).sort((a, b) => a.displayName.localeCompare(b.displayName));
    listEl.innerHTML = items.map((item, idx) => {
      const qtyParts = Object.values(item.units).map(u => {
        if (u.quantity == null) return u.label;
        const qDisplay = Number.isInteger(u.quantity) ? u.quantity : u.quantity.toFixed(1).replace(/[.]0$/, '');
        return `${qDisplay} ${u.label}`.trim();
      }).filter(Boolean);
      return `
        <label class="course-item" id="course-${idx}">
          <input type="checkbox" onchange="document.getElementById('course-${idx}').classList.toggle('checked', this.checked)" />
          <span>${item.displayName}</span>
          <span class="course-qty">${qtyParts.join(' + ')}</span>
        </label>
      `;
    }).join('');
  }

  document.getElementById('resetPlanningBtn').onclick = async () => {
    if (!confirm("Réinitialiser tout le planning de la semaine ?")) return;
    await sb.from('meal_plan').delete().neq('recipe_id', '00000000-0000-0000-0000-000000000000');
    mealPlan = {};
    renderPlanningRecipes();
  };

  document.getElementById('subtabRecipes').onclick = () => {
    document.getElementById('subtabRecipes').classList.add('active');
    document.getElementById('subtabCourses').classList.remove('active');
    document.getElementById('planningRecipesPanel').style.display = 'block';
    document.getElementById('planningCoursesPanel').style.display = 'none';
    renderPlanningRecipes();
  };

  document.getElementById('subtabCourses').onclick = () => {
    document.getElementById('subtabCourses').classList.add('active');
    document.getElementById('subtabRecipes').classList.remove('active');
    document.getElementById('planningCoursesPanel').style.display = 'block';
    document.getElementById('planningRecipesPanel').style.display = 'none';
    renderCoursesList();
  };

  // ---- Authentification ----
  let currentUser = null;
  let authMode = 'login'; // 'login' | 'signup'

  function showAuthView() {
    document.getElementById('authView').style.display = 'block';
    document.getElementById('resetPasswordView').style.display = 'none';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('planningView').style.display = 'none';
    document.getElementById('sharedRecipeView').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
  }

  function showResetPasswordView() {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('planningView').style.display = 'none';
    document.getElementById('sharedRecipeView').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
    document.getElementById('resetPasswordView').style.display = 'block';
  }

  document.getElementById('forgotPasswordBtn').onclick = async () => {
    const email = document.getElementById('auth_email').value.trim();
    const errEl = document.getElementById('authError');
    errEl.style.color = '#B3261E';
    errEl.textContent = '';

    if (!email) {
      errEl.textContent = "Entre ton email ci-dessus, puis reclique sur ce lien.";
      return;
    }

    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    });

    if (error) {
      errEl.textContent = error.message;
      return;
    }
    errEl.style.color = 'var(--interaction-primary)';
    errEl.textContent = "Email envoyé ! Vérifie ta boîte de réception (et les spams).";
  };

  document.getElementById('resetSubmitBtn').onclick = async () => {
    const newPassword = document.getElementById('reset_password').value;
    const errEl = document.getElementById('resetError');
    errEl.style.color = '#B3261E';
    errEl.textContent = '';

    if (!newPassword || newPassword.length < 6) {
      errEl.textContent = "Le mot de passe doit faire au moins 6 caractères.";
      return;
    }

    const { error } = await sb.auth.updateUser({ password: newPassword });
    if (error) {
      errEl.textContent = error.message;
      return;
    }
    // Une fois le mot de passe changé, on entre normalement dans l'app.
    startApp();
  };

  async function startApp() {
    document.getElementById('authView').style.display = 'none';
    document.getElementById('resetPasswordView').style.display = 'none';
    document.getElementById('sharedRecipeView').style.display = 'none';

    const lastView = sessionStorage.getItem('lastView');
    const lastDetailId = sessionStorage.getItem('lastDetailRecipeId');

    if (lastView === 'planning') showPlanning();
    else if (lastView === 'form') showForm();
    else if (lastView === 'account') showAccount();
    else showHome();

    loadMealPlan();
    await loadRecipes();
    ensureProfile();

    if (lastView === 'detail' && lastDetailId) {
      const idx = recipes.findIndex(r => r.id === lastDetailId);
      if (idx !== -1) showDetail(idx);
    }
  }

  async function ensureProfile() {
    const { data: existing } = await sb.from('profiles').select('id').eq('id', currentUser.id).maybeSingle();
    if (existing) return;
    const displayName = currentUser.email.split('@')[0];
    await sb.from('profiles').insert({ id: currentUser.id, email: currentUser.email, display_name: displayName });
  }

  function setAuthMode(mode) {
    authMode = mode;
    document.getElementById('authTabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('authTabSignup').classList.toggle('active', mode === 'signup');
    document.getElementById('authSubmitBtn').textContent = mode === 'login' ? 'Se connecter' : "S'inscrire";
    document.getElementById('authError').textContent = '';
  }

  document.getElementById('authTabLogin').onclick = () => setAuthMode('login');
  document.getElementById('authTabSignup').onclick = () => setAuthMode('signup');

  document.getElementById('authSubmitBtn').onclick = async () => {
    const email = document.getElementById('auth_email').value.trim();
    const password = document.getElementById('auth_password').value;
    const errEl = document.getElementById('authError');
    errEl.textContent = '';

    if (!email || !password) {
      errEl.textContent = "Email et mot de passe requis.";
      return;
    }

    document.getElementById('authSubmitBtn').disabled = true;

    const { data, error } = authMode === 'login'
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password });

    document.getElementById('authSubmitBtn').disabled = false;

    if (error) {
      errEl.textContent = error.message;
      return;
    }

    if (authMode === 'signup' && !data.session) {
      setAuthMode('login');
      errEl.style.color = 'var(--interaction-primary)';
      errEl.textContent = "Compte créé ! Tu peux maintenant te connecter.";
      return;
    }
    // Si une session existe déjà (connexion ou inscription sans confirmation email), onAuthStateChange prend le relais.
  };

  document.getElementById('logoutBtn').onclick = async () => {
    await sb.auth.signOut();
  };

  document.getElementById('updateNameBtn').onclick = async () => {
    const name = document.getElementById('account_display_name').value.trim();
    const errEl = document.getElementById('accountError');
    errEl.style.color = '#B3261E';
    errEl.textContent = '';

    if (!name) {
      errEl.textContent = "Le pseudo ne peut pas être vide.";
      return;
    }

    const { error } = await sb.from('profiles').upsert({ id: currentUser.id, email: currentUser.email, display_name: name });
    if (error) {
      errEl.textContent = error.message;
      return;
    }
    errEl.style.color = 'var(--interaction-primary)';
    errEl.textContent = "Pseudo enregistré ✓";
  };

  document.getElementById('updatePasswordBtn').onclick = async () => {
    const newPassword = document.getElementById('account_new_password').value;
    const errEl = document.getElementById('accountError');
    errEl.style.color = '#B3261E';
    errEl.textContent = '';

    if (!newPassword) {
      errEl.textContent = "Entre un nouveau mot de passe.";
      return;
    }
    if (newPassword.length < 6) {
      errEl.textContent = "Le mot de passe doit faire au moins 6 caractères.";
      return;
    }

    const { error } = await sb.auth.updateUser({ password: newPassword });
    if (error) {
      errEl.textContent = error.message;
      return;
    }
    errEl.style.color = 'var(--interaction-primary)';
    errEl.textContent = "Mot de passe mis à jour ✓";
    document.getElementById('account_new_password').value = '';
  };

  sb.auth.onAuthStateChange((event, session) => {
    currentUser = session ? session.user : null;
    if (event === 'PASSWORD_RECOVERY') {
      showResetPasswordView();
      return;
    }
    if (currentUser) {
      startApp();
    } else if (!new URLSearchParams(location.search).get('recipe')) {
      showAuthView();
    }
  });

  // ---- Recette partagée publique (accessible sans compte) ----
  let currentSharedRecipe = null;

  async function loadSharedRecipe(token) {
    const { data, error } = await sb.from('recipes').select('*').eq('share_token', token).single();
    if (error || !data) {
      document.getElementById('sharedRecipeContent').innerHTML = '<div class="empty" style="padding-top:60px;">Cette recette n\'est plus disponible.</div>';
      document.getElementById('sharedRecipeView').style.display = 'block';
      return;
    }
    const r = data;
    currentSharedRecipe = r;

    let authorName = null;
    if (r.user_id) {
      const { data: authorProfile } = await sb.from('profiles').select('display_name, email').eq('id', r.user_id).maybeSingle();
      if (authorProfile) authorName = authorProfile.display_name || authorProfile.email;
    }

    const sortedIngredients = [...(r.ingredients || [])].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const ingredientsHtml = sortedIngredients.map(ing => `
      <div class="ing-row">
        <span class="ing-row-name">${ing.name}${ing.note ? ' <span class="ing-row-note">(' + ing.note + ')</span>' : ''}</span>
        <span class="ing-row-qty">${ing.quantity ?? ''} ${ing.unit || ''}</span>
      </div>`).join('');
    const stepsHtml = (r.steps && r.steps.length > 0)
      ? '<h2>Étapes</h2><ol>' + r.steps.map(st => `<li>${st}</li>`).join('') + '</ol>'
      : '';

    const isOwnRecipe = currentUser && currentUser.id === r.user_id;
    let banner = '';
    let isSaved = false;

    if (!currentUser) {
      banner = `
        <div style="background:var(--text-icon-primary);color:white;border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <span style="font-size:13px;">Recette partagée${authorName ? ' par ' + authorName : ' avec toi'} ✨</span>
          <button type="button" onclick="location.href = location.pathname;" style="background:var(--surface-highest);color:var(--text-icon-primary);border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;white-space:nowrap;">Créer mon compte</button>
        </div>`;
    } else if (!isOwnRecipe) {
      const { data: existing } = await sb.from('saved_recipes').select('id').eq('user_id', currentUser.id).eq('recipe_id', r.id).maybeSingle();
      isSaved = !!existing;
      banner = `
        ${authorName ? `<p style="font-size:13px;color:var(--text-icon-primary);margin:0 0 12px;"><i class="bi bi-person-circle"></i> Partagée par ${authorName}</p>` : ''}
        <button type="button" class="primary-btn" style="margin-top:0;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:8px;" onclick="toggleSavedRecipe('${r.id}')" id="saveSharedBtn" data-saved="${isSaved}">
          <i class="bi ${isSaved ? 'bi-bookmark-fill' : 'bi-bookmark'}" id="saveSharedIcon"></i> Enregistrer cette recette
        </button>`;
    }

    document.getElementById('sharedRecipeContent').innerHTML = `
      <div style="height:260px;background:var(--surface-lowest);position:relative;">
        ${r.photo_url
          ? `<img src="${r.photo_url}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />`
          : '<div class="photo-empty"><i class="bi bi-image" style="font-size:48px;"></i></div>'}
        ${currentUser ? `<button class="icon-btn icon-btn-lg" style="position:absolute;top:calc(18px + env(safe-area-inset-top));left:18px;" onclick="showHome()"><i class="bi bi-arrow-left icon"></i></button>` : ''}
      </div>
      <div style="background:var(--surface-high);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;padding:24px 16px;">
        ${banner}
        <h1>${r.title}</h1>
        <div class="tags" style="margin-bottom:14px;">${(r.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
        <h2>Ingrédients</h2>
        ${ingredientsHtml}
        ${r.notes ? `<div class="notice" style="margin-top:16px;">${r.notes}</div>` : ''}
        ${stepsHtml}
        ${r.source_url ? `<p style="margin-top:var(--space-section-gap);"><a href="${r.source_url}" target="_blank" rel="noopener" style="color:var(--text-icon-accent);font-size:14px;">Source : ${new URL(r.source_url).hostname.replace('www.', '')}</a></p>` : ''}
      </div>
    `;
    hideAllViewsForShared();
    document.getElementById('sharedRecipeView').style.display = 'block';
  }

  function hideAllViewsForShared() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('planningView').style.display = 'none';
    document.getElementById('accountView').style.display = 'none';
    document.getElementById('authView').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
  }

  async function toggleSavedRecipe(recipeId) {
    const btn = document.getElementById('saveSharedBtn');
    const icon = document.getElementById('saveSharedIcon');
    const currentlySaved = btn.dataset.saved === 'true';
    btn.disabled = true;

    if (currentlySaved) {
      const { error } = await sb.from('saved_recipes').delete().eq('user_id', currentUser.id).eq('recipe_id', recipeId);
      if (error) { alert("Erreur : " + error.message); btn.disabled = false; return; }
      btn.dataset.saved = 'false';
      icon.className = 'bi bi-bookmark';
    } else {
      const { error } = await sb.from('saved_recipes').insert({ user_id: currentUser.id, recipe_id: recipeId });
      if (error) { alert("Erreur : " + error.message); btn.disabled = false; return; }
      btn.dataset.saved = 'true';
      icon.className = 'bi bi-bookmark-fill';
    }

    btn.disabled = false;
    loadSavedRecipes();
  }

  // ---- Recettes enregistrées depuis un partage ----
  let savedRecipes = [];

  async function loadSavedRecipes() {
    const { data, error } = await sb
      .from('saved_recipes')
      .select('id, recipe:recipes(id, title, photo_url, share_token)')
      .order('saved_at', { ascending: false });
    if (error) { console.error(error); return; }
    savedRecipes = (data || []).filter(row => row.recipe);
    renderSavedRecipesStrip();
  }

  function renderSavedRecipesStrip() {
    const section = document.getElementById('savedRecipesSection');
    const strip = document.getElementById('savedRecipesStrip');
    if (savedRecipes.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    strip.innerHTML = savedRecipes.map(row => {
      const r = row.recipe;
      return `
        <div class="mini-card" onclick="loadSharedRecipe('${r.share_token}')">
          <div class="mini-card-photo">${r.photo_url
            ? `<img src="${r.photo_url}" alt="" onerror="this.parentElement.innerHTML='<div class=&quot;photo-empty&quot;><i class=&quot;bi bi-image&quot;></i></div>'" />`
            : '<div class="photo-empty"><i class="bi bi-image"></i></div>'}</div>
          <p>${r.title}</p>
        </div>`;
    }).join('');
  }

  // ---- Point d'entrée ----
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  const sharedToken = new URLSearchParams(location.search).get('recipe');
  if (sharedToken) {
    loadSharedRecipe(sharedToken);
  } else {
    sb.auth.getSession().then(({ data: { session } }) => {
      currentUser = session ? session.user : null;
      if (currentUser) {
        startApp();
      } else {
        showAuthView();
      }
    });
  }
</script>
</body>
</html>
