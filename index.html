<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Mes recettes</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F4F2ED" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<style>
  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    background: #F4F2ED;
    color: #2B2A28;
    margin: 0;
    padding: 18px 18px 100px;
  }
  .serif { font-family: Georgia, 'Times New Roman', serif; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 26px; font-weight: 500; margin: 4px 0 16px; color: #2B2A28; }
  h2 { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; font-weight: 500; margin: 22px 0 12px; color: #2B2A28; }
  .count { font-size: 13px; color: #5A574E; margin-bottom: 14px; }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: white;
    border: 1px solid #EBE8E1;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .card { cursor: pointer; }
  .card-photo {
    height: 130px;
    border-radius: 16px;
    background: #E8E4D8;
    margin-bottom: 8px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card h3 { margin: 0 0 6px; font-size: 13.5px; font-weight: 600; line-height: 1.3; color: #2B2A28; }
  .card-thumb { display: none; }
  .meta-pill {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 20px;
    background: #E4E9D8;
    color: #4A5A38;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    font-size: 12px;
    background: #E4E9D8;
    color: #4A5A38;
    padding: 3px 9px;
    border-radius: 20px;
  }
  #backBtn {
    background: white;
    border: 1px solid #EBE8E1;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 14px;
    margin-bottom: 12px;
    color: #2B2A28;
  }
  .servings-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #EDEAE1;
    border-radius: 14px;
    padding: 12px 16px;
    margin: 16px 0;
  }
  .servings-box button {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid #DAD5C8;
    background: white;
    font-size: 16px;
  }
  .ing-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid #EAE7DE;
  }
  .ing-row-name { font-family: Georgia, serif; font-size: 15px; color: #2B2A28; margin: 0; }
  .ing-row-note { color: #6B6862; font-size: 13px; }
  .ing-row-qty { font-family: Georgia, serif; font-size: 14px; color: #6B6862; white-space: nowrap; margin-left: 12px; }
  ol { padding-left: 20px; }
  ol li { margin-bottom: 10px; line-height: 1.6; font-size: 14.5px; }
  .notice {
    background: #F4E9D8;
    color: #6B4E23;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 16px;
  }
  #bottomNav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: white;
    border-top: 1px solid #EFEDE7;
    padding: 10px 0 max(10px, env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: none;
    border: none;
    padding: 4px 0;
    font-size: 12px;
    color: #5A574E;
  }
  .nav-btn { color: #2B2A28; opacity: 0.4; }
  .nav-btn.active { opacity: 1; font-weight: 600; }
  .icon { font-size: 20px; line-height: 1; color: #2B2A28; }
  .nav-icon { font-size: 20px; line-height: 1; }
  .fab-search {
    position: fixed;
    bottom: calc(72px + env(safe-area-inset-bottom));
    right: 22px;
    width: 50px; height: 50px;
    border-radius: 50%;
    background: #C4623C;
    color: white;
    border: none;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(196,98,60,0.35);
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty { text-align: center; color: #5A574E; padding: 40px 0; font-size: 14px; grid-column: 1 / -1; }
  .field-label { display:block; font-size:13px; color:#5A574E; margin:14px 0 4px; }
  .field-input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #EBE8E1;
    border-radius: 12px;
    font-size: 15px;
    background: white;
    color: #2B2A28;
  }
  .secondary-btn {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: 1.5px dashed #DAD5C8;
    border-radius: 12px;
    background: transparent;
    color: #6B6862;
    font-size: 14px;
  }
  .primary-btn {
    width: 100%;
    padding: 14px;
    margin-top: 24px;
    border: none;
    border-radius: 14px;
    background: #2B2A28;
    color: white;
    font-size: 15px;
    font-weight: 600;
  }
  .row-item {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .row-item input, .row-item select {
    padding: 10px 12px;
    border: 1px solid #EBE8E1;
    border-radius: 12px;
    font-size: 15px;
    background: white;
  }
  .row-item input { flex: 2; min-width: 0; }
  .row-item .qty-input { flex: 1; }
  .row-item .unit-input { flex: 1.3; }
  .remove-row {
    background: none;
    border: none;
    color: #B3261E;
    font-size: 18px;
    padding: 4px 8px;
  }
  .step-item textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #EBE8E1;
    border-radius: 12px;
    font-size: 14px;
    resize: vertical;
    min-height: 44px;
  }
  .day-row {
    background: white;
    border: 1px solid #EBE8E1;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .day-row .day-name { font-size: 13px; color: #5A574E; margin-bottom: 6px; text-transform: capitalize; }
  .day-row select { width: 100%; padding: 9px 10px; border: 1px solid #EBE8E1; border-radius: 10px; font-size: 14px; background: white; margin-bottom: 6px; }
  .day-row .servings-mini { display: flex; align-items: center; gap: 10px; }
  .day-row .servings-mini button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #EBE8E1; background: white; font-size: 14px; }
  .course-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 0;
    border-top: 1px solid #EFEDE7;
    font-size: 14px;
  }
  .course-item:first-child { border-top: none; }
  .course-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #3D5A34; }
  .course-item.checked { color: #5A574E; text-decoration: line-through; }
  .course-qty { margin-left: auto; font-family: Georgia, serif; color: #5A574E; white-space: nowrap; }
  .subtabs {
    display: flex;
    background: #EDEAE1;
    border-radius: 12px;
    padding: 3px;
    margin: 12px 0 18px;
  }
  .subtab-btn {
    flex: 1;
    padding: 8px 0;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 14px;
    color: #5A574E;
  }
  .subtab-btn.active { background: white; color: #2B2A28; font-weight: 600; }
  .plan-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .meal-category-card {
    background: #E4E9D8;
    border-radius: 16px;
    padding: 14px 6px;
    text-align: center;
  }
  .meal-category-number { font-family: Georgia, serif; font-size: 24px; font-weight: 600; color: #2B2A28; margin: 0; }
  .meal-category-label { font-size: 11px; color: #403D36; margin: 4px 0 0; }
  .plan-recipe-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border: 1px solid #EBE8E1;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .plan-recipe-row .plan-recipe-name { font-size: 14px; font-weight: 500; }
  .plan-recipe-row .plan-recipe-tags { font-size: 12px; color: #5A574E; margin-top: 2px; }
  .plan-stepper { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .plan-stepper button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #EBE8E1; background: white; font-size: 15px; }
  .plan-stepper span { min-width: 14px; text-align: center; font-weight: 600; }
  .tag-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; overflow-x: auto; }
  .filter-chip {
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 24px;
    border: 1px solid #EBE8E1;
    background: white;
    color: #403D36;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .filter-chip.active { background: #2B2A28; color: white; border-color: #2B2A28; }
  .autocomplete-box {
    position: absolute;
    background: white;
    border: 1px solid #EBE8E1;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    z-index: 200;
    max-height: 160px;
    overflow-y: auto;
  }
  .autocomplete-item {
    padding: 9px 12px;
    font-size: 14px;
    cursor: pointer;
  }
  .autocomplete-item:hover, .autocomplete-item.highlighted { background: #F4F2ED; }
</style>
</head>
<body>

<div id="listView">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
    <h1 style="margin-bottom:0;">Mes recettes</h1>
    <button id="refreshBtn" class="icon-btn"><i class="bi bi-arrow-clockwise icon"></i></button>
  </div>
  <div style="position:relative;display:none;margin:10px 0;" id="searchWrap">
    <input id="searchInput" class="field-input" placeholder="Rechercher une recette..." style="padding-right:40px;" />
    <button id="clearSearchBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;padding:6px;color:#5A574E;"><i class="bi bi-x-circle-fill"></i></button>
  </div>
  <div id="tagFilters" class="tag-filters"></div>
  <p class="count" id="count">Chargement...</p>
  <div id="cards" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;"></div>
</div>

<button id="searchFab" class="fab-search"><i class="bi bi-search icon" style="color:white;"></i></button>

<div id="detailView" style="display:none;margin:-18px -18px 0;">
  <div id="detailContent"></div>
</div>

<div id="formView" style="display:none;">
  <h1 id="formTitle">Nouvelle recette</h1>

  <label class="field-label">Titre</label>
  <input id="f_title" class="field-input" placeholder="Ex: Gâteau au yaourt" />

  <label class="field-label">Photo</label>
  <div id="photoPreviewWrap" style="display:none;margin-bottom:8px;">
    <img id="photoPreview" style="width:100%;height:160px;object-fit:cover;border-radius:12px;" />
  </div>
  <div style="display:flex;gap:8px;margin-bottom:8px;">
    <button type="button" id="choosePhotoBtn" class="secondary-btn" style="margin-top:0;flex:1;"><i class="bi bi-images"></i> Galerie</button>
    <button type="button" id="takePhotoBtn" class="secondary-btn" style="margin-top:0;flex:1;"><i class="bi bi-camera"></i> Appareil photo</button>
  </div>
  <input type="file" id="photoFileInput" accept="image/*" style="display:none;" />
  <input type="file" id="photoCameraInput" accept="image/*" capture="environment" style="display:none;" />
  <input id="f_photo" class="field-input" placeholder="ou colle un lien URL..." style="margin-bottom:4px;" />
  <p id="photoUploadStatus" style="font-size:12px;color:#5A574E;margin:0;"></p>

  <label class="field-label">Tags (séparés par une virgule)</label>
  <input id="f_tags" class="field-input" placeholder="Ex: dessert, goûter" />

  <label class="field-label">Portions de référence</label>
  <input id="f_servings" class="field-input" type="number" value="4" />

  <div style="display:flex; gap:10px;">
    <div style="flex:1;">
      <label class="field-label">Préparation (min)</label>
      <input id="f_prep" class="field-input" type="number" />
    </div>
    <div style="flex:1;">
      <label class="field-label">Cuisson (min)</label>
      <input id="f_cook" class="field-input" type="number" />
    </div>
    <div style="flex:1;">
      <label class="field-label">Four (°C)</label>
      <input id="f_oven" class="field-input" type="number" />
    </div>
  </div>

  <label class="field-label">Note (optionnel)</label>
  <input id="f_notes" class="field-input" placeholder="Ex: Attention aux oeufs avec le chocolat chaud !" />

  <h2>Ingrédients</h2>
  <div id="f_ingredients" style="position:relative;"></div>
  <button type="button" id="addIngBtn" class="secondary-btn">+ Ajouter un ingrédient</button>

  <h2>Étapes</h2>
  <label class="field-label">Étapes (une par ligne)</label>
  <textarea id="f_steps" class="field-input" style="min-height:140px;resize:vertical;" placeholder="Préchauffer le four à 180°.&#10;Mélanger le beurre et le sucre.&#10;Ajouter la farine..."></textarea>

  <button type="button" id="saveBtn" class="primary-btn">Enregistrer la recette</button>
  <p id="formError" style="color:#B3261E;font-size:13px;"></p>
</div>

<nav id="bottomNav">
  <button id="navHome" class="nav-btn active">
    <i class="bi bi-house nav-icon"></i>
    <span>Accueil</span>
  </button>
  <button id="navPlanning" class="nav-btn">
    <i class="bi bi-calendar3 nav-icon"></i>
    <span>Planning</span>
  </button>
  <button id="navAdd" class="nav-btn">
    <i class="bi bi-plus-lg nav-icon"></i>
    <span>Ajouter</span>
  </button>
</nav>

<div id="planningView" style="display:none;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <h1 style="margin-bottom:0;">Planning</h1>
    <button id="resetPlanningBtn" class="icon-btn"><i class="bi bi-arrow-counterclockwise icon"></i></button>
  </div>
  <div class="subtabs">
    <button id="subtabRecipes" class="subtab-btn active">Recettes</button>
    <button id="subtabCourses" class="subtab-btn">Liste de courses</button>
  </div>

  <div id="planningRecipesPanel">
    <div id="planSummary" class="plan-summary"></div>
    <div id="planningRecipeList"></div>
  </div>

  <div id="planningCoursesPanel" style="display:none;">
    <div id="coursesList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bhsftmcluaqztkfnwobx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJoc2Z0bWNsdWFxenRrZm53b2J4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTE1ODgsImV4cCI6MjEwNDc4NzU4OH0.ovrCW7IRhkH8tfMYyExNp6zKt60EJMpJLcehlastIAI";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let recipes = [];
  let currentServings = {};

  async function loadRecipes() {
    const { data, error } = await sb.from('recipes').select('*').order('created_at', { ascending: false });
    if (error) {
      document.getElementById('count').textContent = "Erreur de chargement";
      console.error(error);
      return;
    }
    recipes = data;
    renderList();
  }

  let activeTagFilter = null;
  let searchQuery = '';

  function renderTagFilters() {
    const allTags = [...new Set(recipes.flatMap(r => r.tags || []))].sort();
    const container = document.getElementById('tagFilters');
    if (allTags.length === 0) { container.innerHTML = ''; return; }
    container.innerHTML = allTags.map(t => `
      <button type="button" class="filter-chip ${activeTagFilter === t ? 'active' : ''}" data-tag="${t}"><i class="bi bi-tag"></i> ${t}</button>
    `).join('');
    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.onclick = () => {
        const tag = chip.dataset.tag;
        activeTagFilter = (activeTagFilter === tag) ? null : tag;
        renderList();
      };
    });
  }

  function getFilteredIndices() {
    return recipes
      .map((r, i) => i)
      .filter(i => {
        const r = recipes[i];
        const matchesSearch = !searchQuery || r.title.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesTag = !activeTagFilter || (r.tags || []).includes(activeTagFilter);
        return matchesSearch && matchesTag;
      });
  }

  function renderList() {
    renderTagFilters();
    const filteredIndices = getFilteredIndices();
    document.getElementById('count').textContent = filteredIndices.length + " recette" + (filteredIndices.length > 1 ? "s" : "");
    const cardsEl = document.getElementById('cards');
    if (recipes.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucune recette pour l\'instant.</div>';
      return;
    }
    if (filteredIndices.length === 0) {
      cardsEl.innerHTML = '<div class="empty">Aucun résultat pour ces critères.</div>';
      return;
    }
    cardsEl.innerHTML = filteredIndices.map(i => {
      const r = recipes[i];
      const totalTime = (r.prep_time_minutes || 0) + (r.cook_time_minutes || 0);
      const photo = r.photo_url || `https://loremflickr.com/300/200/${encodeURIComponent(r.title.split(' ')[0])},food`;
      return `
      <div class="card" onclick="showDetail(${i})">
        <div class="card-photo">
          <img src="${photo}" alt="" onerror="this.parentElement.innerHTML='<i class=&quot;bi bi-egg-fried&quot; style=&quot;font-size:28px;color:#B8B4AA;&quot;></i>'" />
        </div>
        <h3>${r.title}</h3>
        ${totalTime > 0 ? `<span class="meta-pill"><i class="bi bi-clock" style="font-size:13px;color:#2B2A28;"></i> ${totalTime} min</span>` : ''}
      </div>
    `;
    }).join('');
  }

  document.getElementById('searchFab').onclick = () => {
    const wrap = document.getElementById('searchWrap');
    const input = document.getElementById('searchInput');
    const showing = wrap.style.display !== 'none';
    wrap.style.display = showing ? 'none' : 'block';
    if (!showing) input.focus();
  };

  document.getElementById('clearSearchBtn').onclick = () => {
    const input = document.getElementById('searchInput');
    input.value = '';
    searchQuery = '';
    renderList();
    input.focus();
  };

  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    renderList();
  };

  let currentDetailIndex = null;

  function showDetail(i) {
    window.scrollTo(0, 0);
    currentDetailIndex = i;
    const r = recipes[i];
    currentServings[i] = r.servings || 4;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
    renderDetail(i);
  }

  function renderDetail(i) {
    const r = recipes[i];
    const base = r.servings || 4;
    const s = currentServings[i];
    const metaPills = [];
    if (r.prep_time_minutes) metaPills.push(`<span class="meta-pill"><i class="bi bi-clock" style="font-size:13px;color:#2B2A28;"></i> ${r.prep_time_minutes} min</span>`);
    if (r.cook_time_minutes) metaPills.push(`<span class="meta-pill"><i class="bi bi-fire" style="font-size:13px;color:#2B2A28;"></i> ${r.cook_time_minutes} min</span>`);
    if (r.oven_temp_celsius) metaPills.push(`<span class="meta-pill"><i class="bi bi-thermometer-half" style="font-size:13px;color:#2B2A28;"></i> ${r.oven_temp_celsius}°</span>`);

    function ingredientImageUrl(name) {
      const keyword = encodeURIComponent(name.trim().split(' ')[0]);
      return `https://loremflickr.com/60/60/${keyword},food`;
    }

    const sortedIngredients = [...(r.ingredients || [])].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    const ingredientsHtml = sortedIngredients.map(ing => {
      const q = ing.quantity != null ? (ing.quantity * s / base) : null;
      const qDisplay = q != null ? (Number.isInteger(q) ? q : q.toFixed(1).replace(/[.]0$/, '')) : '';
      return `
      <div class="ing-row">
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="${ingredientImageUrl(ing.name)}" alt="" style="width:36px;height:36px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#E8E4D8;" onerror="this.style.display='none'" />
          <span class="ing-row-name">${ing.name}${ing.note ? ' <span class="ing-row-note">(' + ing.note + ')</span>' : ''}</span>
        </div>
        <span class="ing-row-qty">${qDisplay} ${ing.unit || ''}</span>
      </div>`;
    }).join('');

    const stepsHtml = (r.steps && r.steps.length > 0)
      ? '<h2>Étapes</h2><ol>' + r.steps.map(st => `<li>${st}</li>`).join('') + '</ol>'
      : '';

    const recipePhoto = r.photo_url || `https://loremflickr.com/600/400/${encodeURIComponent(r.title.split(' ')[0])},food`;

    document.getElementById('detailContent').innerHTML = `
      <div style="height:260px;background:#E8E4D8;position:relative;">
        <img src="${recipePhoto}" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'" />
        <button class="icon-btn" style="position:absolute;top:18px;left:18px;background:rgba(255,255,255,0.9);" onclick="goBackFromDetail()"><i class="bi bi-arrow-left icon"></i></button>
        <div style="position:absolute;top:18px;right:18px;display:flex;gap:8px;">
          <button class="icon-btn" style="background:rgba(255,255,255,0.9);" onclick="editCurrentRecipe()"><i class="bi bi-pencil icon"></i></button>
          <button class="icon-btn" style="background:rgba(255,255,255,0.9);" onclick="deleteCurrentRecipe()"><i class="bi bi-trash icon"></i></button>
        </div>
      </div>
      <div style="background:#F4F2ED;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;padding:20px 18px 24px;">
        <h1 style="margin-bottom:12px;">${r.title}</h1>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
          ${metaPills.join('')}
        </div>
        <div class="tags" style="margin-bottom:14px;">${(r.tags || []).map(t => `<span class="tag">#${t}</span>`).join('')}</div>
        <div class="servings-box">
          <span style="font-size:14px;color:#403D36;">Portions</span>
          <div style="display:flex;align-items:center;gap:14px;">
            <button onclick="changeServings(${i}, -1)">−</button>
            <span style="font-weight:600;min-width:16px;text-align:center;">${s}</span>
            <button onclick="changeServings(${i}, 1)">+</button>
          </div>
        </div>
        <h2>Ingrédients</h2>
        ${ingredientsHtml}
        ${r.notes ? `<div class="notice" style="margin-top:16px;">${r.notes}</div>` : ''}
        ${stepsHtml}
      </div>
    `;
  }

  function changeServings(i, delta) {
    const newVal = currentServings[i] + delta;
    if (newVal < 1) return;
    currentServings[i] = newVal;
    renderDetail(i);
  }

  function goBackFromDetail() {
    window.scrollTo(0, 0);
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('searchFab').style.display = 'block';
  }

  function hideAllViews() {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'none';
    document.getElementById('planningView').style.display = 'none';
    document.getElementById('searchFab').style.display = 'none';
    document.getElementById('navHome').classList.remove('active');
    document.getElementById('navAdd').classList.remove('active');
    document.getElementById('navPlanning').classList.remove('active');
  }

  function showHome() {
    window.scrollTo(0, 0);
    hideAllViews();
    document.getElementById('listView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('searchFab').style.display = 'block';
    document.getElementById('navHome').classList.add('active');
  }

  function showForm() {
    window.scrollTo(0, 0);
    hideAllViews();
    document.getElementById('formView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navAdd').classList.add('active');
    resetForm();
  }

  function showPlanning() {
    window.scrollTo(0, 0);
    hideAllViews();
    document.getElementById('planningView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
    document.getElementById('navPlanning').classList.add('active');
    renderPlanningRecipes();
  }

  document.getElementById('navHome').onclick = showHome;
  document.getElementById('navAdd').onclick = showForm;
  document.getElementById('navPlanning').onclick = showPlanning;

  document.getElementById('refreshBtn').onclick = () => {
    location.href = location.pathname + '?t=' + Date.now();
  };

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && document.getElementById('listView').style.display !== 'none') {
      loadRecipes();
    }
  });

  // ---- Gestion du formulaire d'ajout / édition ----
  let ingRows = [];
  let editingId = null;

  function editCurrentRecipe() {
    const r = recipes[currentDetailIndex];
    editingId = r.id;
    document.getElementById('formTitle').textContent = "Modifier la recette";
    document.getElementById('f_title').value = r.title || '';
    document.getElementById('f_photo').value = r.photo_url || '';
    updatePhotoPreview(r.photo_url);
    document.getElementById('f_tags').value = (r.tags || []).join(', ');
    document.getElementById('f_servings').value = r.servings || 4;
    document.getElementById('f_prep').value = r.prep_time_minutes || '';
    document.getElementById('f_cook').value = r.cook_time_minutes || '';
    document.getElementById('f_oven').value = r.oven_temp_celsius || '';
    document.getElementById('f_notes').value = r.notes || '';
    ingRows = (r.ingredients || []).map(ing => ({
      qtyUnitText: [ing.quantity, ing.unit].filter(v => v != null && v !== '').join(' '),
      name: ing.name ?? ''
    }));
    if (ingRows.length === 0) ingRows = [{ qtyUnitText: '', name: '' }];
    document.getElementById('f_steps').value = (r.steps || []).join('\n');
    renderIngRows();
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
    document.getElementById('bottomNav').style.display = 'flex';
  }

  async function deleteCurrentRecipe() {
    const r = recipes[currentDetailIndex];
    if (!confirm(`Supprimer "${r.title}" ? Cette action est irréversible.`)) return;
    const { error } = await sb.from('recipes').delete().eq('id', r.id);
    if (error) {
      alert("Erreur lors de la suppression : " + error.message);
      return;
    }
    await loadRecipes();
    showHome();
  }

  // ---- Normalisation ingrédients / unités ----
  const UNIT_CANON = {
    'paquet': 'sachet', 'paquets': 'sachet', 'sachets': 'sachet',
    'grammes': 'g', 'gramme': 'g',
    'kilo': 'kg', 'kilos': 'kg', 'kilogramme': 'kg', 'kilogrammes': 'kg',
    'litres': 'l', 'litre': 'l',
    'millilitres': 'ml', 'millilitre': 'ml',
    'cas': 'c.à.s', 'cuillere a soupe': 'c.à.s', 'cuillères à soupe': 'c.à.s', 'cuillere a soupes': 'c.à.s',
    'cac': 'c.à.c', 'cuillere a cafe': 'c.à.c', 'cuillères à café': 'c.à.c',
    'pieces': 'pièce', 'piece': 'pièce', 'pièces': 'pièce',
    'tasses': 'tasse',
    'pincees': 'pincée', 'pincee': 'pincée', 'pincées': 'pincée'
  };

  function canonicalizeUnit(raw) {
    if (!raw) return null;
    let u = normalize(raw); // lowercase, trim, sans accents
    if (UNIT_CANON[u]) return UNIT_CANON[u];
    // essaie sans le "s" final (pluriel simple) si pas déjà reconnu
    if (u.endsWith('s') && UNIT_CANON[u.slice(0, -1)]) return UNIT_CANON[u.slice(0, -1)];
    return raw.trim();
  }

  function canonicalizeIngredientName(raw) {
    const trimmed = raw.trim();
    const key = normalize(trimmed).replace(/s$/, ''); // ignore pluriel simple
    const known = getKnownIngredientNames();
    const match = known.find(n => normalize(n).replace(/s$/, '') === key);
    return match || trimmed;
  }

  function getKnownIngredientNames() {
    const set = new Set();
    recipes.forEach(r => (r.ingredients || []).forEach(ing => { if (ing.name) set.add(ing.name); }));
    return [...set];
  }

  function parseQtyUnit(text) {
    const t = (text || '').trim();
    if (!t) return { quantity: null, unit: null };
    const match = t.match(/^([\d]+[.,]?[\d]*)\s*(.*)$/);
    if (match) {
      const quantity = parseFloat(match[1].replace(',', '.'));
      const unitRaw = match[2].trim();
      return { quantity: isNaN(quantity) ? null : quantity, unit: unitRaw ? canonicalizeUnit(unitRaw) : null };
    }
    // pas de nombre trouvé : tout est traité comme une unité (ex: "pincée")
    return { quantity: null, unit: canonicalizeUnit(t) };
  }

  let acBox = null;

  function closeAutocomplete() {
    if (acBox) { acBox.remove(); acBox = null; }
  }

  function openAutocomplete(inputEl, idx) {
    const query = normalize(inputEl.value);
    const seen = new Set();
    const matches = getKnownIngredientNames()
      .filter(n => {
        const norm = normalize(n);
        if (!query || !norm.includes(query) || norm === query) return false;
        const singularKey = norm.replace(/s$/, '');
        if (seen.has(singularKey)) return false;
        seen.add(singularKey);
        return true;
      })
      .slice(0, 6);

    closeAutocomplete();
    if (matches.length === 0) return;

    acBox = document.createElement('div');
    acBox.className = 'autocomplete-box';
    acBox.style.left = inputEl.offsetLeft + 'px';
    acBox.style.top = (inputEl.offsetTop + inputEl.offsetHeight + 2) + 'px';
    acBox.style.width = inputEl.offsetWidth + 'px';
    acBox.innerHTML = matches.map(n => `<div class="autocomplete-item" data-value="${n}">${n}</div>`).join('');
    inputEl.parentElement.appendChild(acBox);

    acBox.querySelectorAll('.autocomplete-item').forEach(item => {
      item.onmousedown = (e) => {
        e.preventDefault();
        inputEl.value = item.dataset.value;
        ingRows[idx].name = item.dataset.value;
        closeAutocomplete();
      };
    });
  }

  function renderIngRows() {
    document.getElementById('f_ingredients').innerHTML = ingRows.map((_, idx) => `
      <div class="row-item" style="position:relative;">
        <input class="qty-input" placeholder="Qté (ex: 200g)" data-idx="${idx}" data-field="qtyUnitText" value="${ingRows[idx].qtyUnitText ?? ''}" />
        <input class="ing-name-input" placeholder="Nom de l'ingrédient" autocomplete="off" data-idx="${idx}" data-field="name" value="${ingRows[idx].name ?? ''}" />
        <button type="button" class="remove-row" data-remove-ing="${idx}">✕</button>
      </div>`
    ).join('');
    document.querySelectorAll('#f_ingredients input').forEach(inp => {
      const handler = (e) => {
        const idx = e.target.dataset.idx, field = e.target.dataset.field;
        ingRows[idx][field] = e.target.value;
      };
      inp.oninput = handler;
      inp.onchange = handler;
    });
    document.querySelectorAll('.ing-name-input').forEach(inp => {
      inp.addEventListener('input', () => openAutocomplete(inp, Number(inp.dataset.idx)));
      inp.addEventListener('focus', () => openAutocomplete(inp, Number(inp.dataset.idx)));
      inp.addEventListener('blur', () => setTimeout(closeAutocomplete, 150));
    });
    document.querySelectorAll('[data-remove-ing]').forEach(btn => {
      btn.onclick = (e) => {
        ingRows.splice(Number(e.target.dataset.removeIng), 1);
        renderIngRows();
      };
    });
  }

  // ---- Upload de photo (galerie / appareil photo) ----
  function updatePhotoPreview(url) {
    const wrap = document.getElementById('photoPreviewWrap');
    const img = document.getElementById('photoPreview');
    if (url) {
      img.src = url;
      wrap.style.display = 'block';
    } else {
      wrap.style.display = 'none';
    }
  }

  async function handlePhotoFile(file) {
    if (!file) return;
    const statusEl = document.getElementById('photoUploadStatus');
    statusEl.textContent = "Envoi de la photo...";
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;

    const { error } = await sb.storage.from('recipe-photos').upload(path, file);
    if (error) {
      statusEl.textContent = "Erreur d'envoi : " + error.message;
      return;
    }
    const { data } = sb.storage.from('recipe-photos').getPublicUrl(path);
    document.getElementById('f_photo').value = data.publicUrl;
    updatePhotoPreview(data.publicUrl);
    statusEl.textContent = "Photo ajoutée ✓";
  }

  document.getElementById('choosePhotoBtn').onclick = () => document.getElementById('photoFileInput').click();
  document.getElementById('takePhotoBtn').onclick = () => document.getElementById('photoCameraInput').click();
  document.getElementById('photoFileInput').onchange = (e) => handlePhotoFile(e.target.files[0]);
  document.getElementById('photoCameraInput').onchange = (e) => handlePhotoFile(e.target.files[0]);
  document.getElementById('f_photo').addEventListener('input', (e) => {
    document.getElementById('photoUploadStatus').textContent = '';
    updatePhotoPreview(e.target.value.trim());
  });

  document.getElementById('addIngBtn').onclick = () => {
    ingRows.push({ qtyUnitText: '', name: '' });
    renderIngRows();
  };

  function resetForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = "Nouvelle recette";
    document.getElementById('f_title').value = '';
    document.getElementById('f_photo').value = '';
    updatePhotoPreview(null);
    document.getElementById('photoUploadStatus').textContent = '';
    document.getElementById('f_tags').value = '';
    document.getElementById('f_servings').value = 4;
    document.getElementById('f_prep').value = '';
    document.getElementById('f_cook').value = '';
    document.getElementById('f_oven').value = '';
    document.getElementById('f_notes').value = '';
    document.getElementById('f_steps').value = '';
    document.getElementById('formError').textContent = '';
    ingRows = [{ qtyUnitText: '', name: '' }];
    renderIngRows();
  }

  document.getElementById('saveBtn').onclick = async () => {
    const title = document.getElementById('f_title').value.trim();
    const errEl = document.getElementById('formError');
    errEl.textContent = '';

    if (!title) {
      errEl.textContent = "Le titre est obligatoire.";
      return;
    }

    const tags = document.getElementById('f_tags').value
      .split(',').map(t => t.trim()).filter(Boolean);

    const ingredients = ingRows
      .filter(ing => ing.name && ing.name.trim())
      .map(ing => {
        const { quantity, unit } = parseQtyUnit(ing.qtyUnitText);
        return {
          name: canonicalizeIngredientName(ing.name),
          quantity,
          unit
        };
      });

    const steps = document.getElementById('f_steps').value
      .split('\n').map(s => s.trim()).filter(Boolean);

    const payload = {
      title,
      photo_url: document.getElementById('f_photo').value.trim() || null,
      tags,
      servings: Number(document.getElementById('f_servings').value) || 4,
      prep_time_minutes: document.getElementById('f_prep').value ? Number(document.getElementById('f_prep').value) : null,
      cook_time_minutes: document.getElementById('f_cook').value ? Number(document.getElementById('f_cook').value) : null,
      oven_temp_celsius: document.getElementById('f_oven').value ? Number(document.getElementById('f_oven').value) : null,
      notes: document.getElementById('f_notes').value.trim() || null,
      ingredients,
      steps
    };

    document.getElementById('saveBtn').textContent = "Enregistrement...";
    document.getElementById('saveBtn').disabled = true;

    const { error } = editingId
      ? await sb.from('recipes').update(payload).eq('id', editingId)
      : await sb.from('recipes').insert(payload);

    document.getElementById('saveBtn').textContent = "Enregistrer la recette";
    document.getElementById('saveBtn').disabled = false;

    if (error) {
      errEl.textContent = "Erreur lors de l'enregistrement : " + error.message;
      console.error(error);
      return;
    }

    resetForm();
    await loadRecipes();
    showHome();
  };

  resetForm();

  // ---- Planning (sélection par compteur) ----
  let mealPlan = {}; // { recipe_id: count }

  async function loadMealPlan() {
    const { data, error } = await sb.from('meal_plan').select('*');
    if (error) { console.error(error); return; }
    mealPlan = {};
    (data || []).forEach(row => { mealPlan[row.recipe_id] = row.count; });
  }

  const MEAL_CATEGORIES = [
    { label: 'Petit-déj', keywords: ['petit-dej', 'petit dej', 'petitdej', 'breakfast'] },
    { label: 'Déjeuner', keywords: ['dejeuner', 'lunch'] },
    { label: 'Dîner', keywords: ['diner', 'dinner'] },
    { label: 'Encas', keywords: ['gouter', 'encas', 'snack', 'apero', 'aperitif'] }
  ];

  function renderPlanningRecipes() {
    const counts = MEAL_CATEGORIES.map(cat => {
      let total = 0;
      recipes.forEach(r => {
        const count = mealPlan[r.id] || 0;
        if (count === 0) return;
        if ((r.tags || []).some(t => cat.keywords.includes(normalize(t)))) total += count;
      });
      return total;
    });

    document.getElementById('planSummary').innerHTML = MEAL_CATEGORIES.map((cat, idx) => `
      <div class="meal-category-card">
        <p class="meal-category-number">${counts[idx]}</p>
        <p class="meal-category-label">${cat.label}</p>
      </div>
    `).join('');

    // Liste des recettes avec stepper
    const listEl = document.getElementById('planningRecipeList');
    listEl.innerHTML = recipes.map(r => {
      const count = mealPlan[r.id] || 0;
      return `
        <div class="plan-recipe-row">
          <div>
            <div class="plan-recipe-name">${r.title}</div>
            <div class="plan-recipe-tags">${(r.tags || []).map(t => '#' + t).join(' ')}</div>
          </div>
          <div class="plan-stepper">
            <button type="button" data-plan-recipe="${r.id}" data-delta="-1">−</button>
            <span data-plan-count="${r.id}">${count}</span>
            <button type="button" data-plan-recipe="${r.id}" data-delta="1">+</button>
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('[data-plan-recipe]').forEach(btn => {
      btn.onclick = async (e) => {
        const recipeId = e.target.dataset.planRecipe;
        const delta = Number(e.target.dataset.delta);
        const newVal = Math.max(0, (mealPlan[recipeId] || 0) + delta);
        mealPlan[recipeId] = newVal;

        if (newVal === 0) {
          await sb.from('meal_plan').delete().eq('recipe_id', recipeId);
        } else {
          await sb.from('meal_plan').upsert({ recipe_id: recipeId, count: newVal });
        }
        renderPlanningRecipes();
      };
    });
  }

  function normalize(str) {
    return (str || '')
      .toLowerCase()
      .trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // retire les accents
  }

  function renderCoursesList() {
    const aggregated = {}; // key: normalized name -> { displayName, units: { unitKey: { label, quantity } } }
    let hasAnySelection = false;

    recipes.forEach(r => {
      const count = mealPlan[r.id] || 0;
      if (count === 0) return;
      hasAnySelection = true;
      (r.ingredients || []).forEach(ing => {
        const nameKey = normalize(ing.name).replace(/s$/, '');
        const unitKey = normalize(ing.unit);
        const scaledQty = ing.quantity != null ? ing.quantity * count : null;

        if (!aggregated[nameKey]) {
          aggregated[nameKey] = { displayName: ing.name.trim(), units: {} };
        }
        if (!aggregated[nameKey].units[unitKey]) {
          aggregated[nameKey].units[unitKey] = { label: ing.unit || '', quantity: scaledQty };
        } else if (scaledQty != null) {
          aggregated[nameKey].units[unitKey].quantity = (aggregated[nameKey].units[unitKey].quantity || 0) + scaledQty;
        }
      });
    });

    const listEl = document.getElementById('coursesList');
    if (!hasAnySelection) {
      listEl.innerHTML = '<div class="empty">Sélectionne des recettes dans l\'onglet "Recettes" pour générer ta liste de courses.</div>';
      return;
    }
    const items = Object.values(aggregated).sort((a, b) => a.displayName.localeCompare(b.displayName));
    listEl.innerHTML = items.map((item, idx) => {
      const qtyParts = Object.values(item.units).map(u => {
        if (u.quantity == null) return u.label;
        const qDisplay = Number.isInteger(u.quantity) ? u.quantity : u.quantity.toFixed(1).replace(/[.]0$/, '');
        return `${qDisplay} ${u.label}`.trim();
      }).filter(Boolean);
      return `
        <label class="course-item" id="course-${idx}">
          <input type="checkbox" onchange="document.getElementById('course-${idx}').classList.toggle('checked', this.checked)" />
          <span>${item.displayName}</span>
          <span class="course-qty">${qtyParts.join(' + ')}</span>
        </label>
      `;
    }).join('');
  }

  document.getElementById('resetPlanningBtn').onclick = async () => {
    if (!confirm("Réinitialiser tout le planning de la semaine ?")) return;
    await sb.from('meal_plan').delete().neq('recipe_id', '00000000-0000-0000-0000-000000000000');
    mealPlan = {};
    renderPlanningRecipes();
  };

  document.getElementById('subtabRecipes').onclick = () => {
    document.getElementById('subtabRecipes').classList.add('active');
    document.getElementById('subtabCourses').classList.remove('active');
    document.getElementById('planningRecipesPanel').style.display = 'block';
    document.getElementById('planningCoursesPanel').style.display = 'none';
    renderPlanningRecipes();
  };

  document.getElementById('subtabCourses').onclick = () => {
    document.getElementById('subtabCourses').classList.add('active');
    document.getElementById('subtabRecipes').classList.remove('active');
    document.getElementById('planningCoursesPanel').style.display = 'block';
    document.getElementById('planningRecipesPanel').style.display = 'none';
    renderCoursesList();
  };

  loadMealPlan();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  loadRecipes();
</script>
